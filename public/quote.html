<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your quote</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<style>
  :root{--ink:#0f1626;--ink-2:#4a5568;--paper:#f6f7fb;--surface:#fff;--line:#e3e7f0;--neon:#7aa116;--good:#1f9d55;--bad:#c53030;--muted:#77809a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Helvetica Neue",Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5}
  .wrap{max-width:660px;margin:0 auto;padding:0 20px 60px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;margin-top:20px;box-shadow:0 10px 30px -22px rgba(20,30,60,.35)}
  h1{font-size:1.7rem;margin-bottom:4px}
  h2{font-size:1.05rem;margin-bottom:10px}
  .muted{color:var(--muted)}
  .eyebrow{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .row{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:0}
  .row .qty{color:var(--muted);font-size:.85rem}
  .total{display:flex;justify-content:space-between;gap:14px;padding-top:14px;margin-top:6px;border-top:2px solid var(--ink);font-size:1.25rem;font-weight:800}
  .terms{background:#f0f4ff;border:1px solid #dde5ff;border-radius:12px;padding:14px 16px;margin-top:18px;font-size:.94rem}
  .btn{font:inherit;font-weight:700;border:0;border-radius:100px;padding:14px 26px;cursor:pointer;font-size:1rem;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn-accept{background:var(--neon);color:#fff;width:100%}
  .btn-pay{background:var(--ink);color:#fff;width:100%}
  .btn-decline{background:transparent;color:var(--muted);border:1px solid var(--line);width:100%;margin-top:10px;font-size:.9rem;padding:11px 20px}
  .state{text-align:center;padding:28px 20px}
  .state .big{font-size:2.4rem;line-height:1}
  .foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:22px}
  @media(max-width:520px){ .card{padding:20px} h1{font-size:1.4rem} }
</style>
</head>
<body>
<div class="wrap" id="root"><p class="muted" style="margin-top:50px;text-align:center">Loading…</p></div>

<script>
const $=id=>document.getElementById(id);
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(p){return '£'+((p||0)/100).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtDate(ts){return ts?new Date(ts).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'';}

const TOKEN=new URLSearchParams(location.search).get('q')||'';
const JUST_PAID=new URLSearchParams(location.search).get('paid')==='1';
let DATA=null;

async function load(){
  if(!TOKEN){ $('root').innerHTML='<div class="card state"><p>No quote reference in that link.</p></div>'; return; }
  try{
    const r=await fetch('/api/quote/'+encodeURIComponent(TOKEN));
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'Not found');
    DATA=d; render();
  }catch(e){
    $('root').innerHTML='<div class="card state"><p>'+esc(e.message)+'</p><p class="muted" style="margin-top:8px">Please check the link, or ask for a new one.</p></div>';
  }
}

function render(){
  const q=DATA.quote, b=DATA.booking, dj=DATA.dj;
  const items=(q.items||[]).map(it=>`
    <div class="row">
      <div>${esc(it.name)}${it.description?`<div class="muted" style="font-size:.85rem">${esc(it.description)}</div>`:''}
        ${it.qty>1?`<div class="qty">${it.qty} × ${money(it.unit_pence)}</div>`:''}</div>
      <div style="font-weight:700;white-space:nowrap">${money(it.qty*it.unit_pence)}</div>
    </div>`).join('');

  // What the client can do depends on where the quote is.
  let action='';
  if(q.status==='sent'){
    action=`
      <div style="margin-top:22px">
        <button class="btn btn-accept" onclick="respond(true)">Accept this quote</button>
        <button class="btn btn-decline" onclick="respond(false)">No thanks</button>
      </div>`;
  }else if(q.status==='accepted'){
    action=`
      <div style="margin-top:22px">
        <div class="state" style="padding:14px 0">
          <div class="big">✓</div>
          <p style="font-weight:700;margin-top:6px">Accepted${q.responded_at?' on '+new Date(q.responded_at).toLocaleDateString('en-GB'):''}</p>
        </div>
        ${JUST_PAID
          ? '<p style="text-align:center;color:var(--good);font-weight:700">Thank you — your deposit has been received.</p>'
          : (q.deposit_pence
              ? `<button class="btn btn-pay" onclick="payDeposit(this)">Pay ${money(q.deposit_pence)} deposit</button>
                 <p class="muted" style="font-size:.82rem;text-align:center;margin-top:10px">Secure payment. Your card details go straight to the payment provider.</p>`
              : '')}
      </div>`;
  }else if(q.status==='declined'){
    action=`<div class="state"><div class="big">—</div><p style="margin-top:6px">You declined this quote.</p>
            <p class="muted" style="margin-top:6px">If that was a mistake, just reply to the email.</p></div>`;
  }else if(q.status==='expired'){
    action=`<div class="state"><div class="big">⏳</div><p style="margin-top:6px">This quote has expired.</p>
            <p class="muted" style="margin-top:6px">Please ask for an up-to-date one.</p></div>`;
  }else{
    action=`<div class="state"><p class="muted">This quote isn't ready yet.</p></div>`;
  }

  $('root').innerHTML=`
    <div class="card" style="margin-top:34px">
      <p class="eyebrow">${esc((dj&&dj.company)||'Your quote')}</p>
      <h1>${esc(b&&b.title||'Your quote')}</h1>
      ${b&&b.event_date?`<p class="muted">${esc(fmtDate(b.event_date))}${b.venue?' · '+esc(b.venue):''}</p>`:''}
      ${q.message?`<p style="margin-top:16px;white-space:pre-wrap">${esc(q.message)}</p>`:''}

      <div style="margin-top:22px">
        <h2>What's included</h2>
        ${items||'<p class="muted">No items listed.</p>'}
        <div class="total"><span>Total</span><span>${money(q.total_pence)}</span></div>
      </div>

      ${q.schedule_text?`<div class="terms">${esc(q.schedule_text)}</div>`:''}
      ${action}
    </div>
    <p class="foot">${esc((dj&&dj.company)||'')}${dj&&dj.email?' · '+esc(dj.email):''}</p>
  `;
}

async function respond(accept){
  if(!accept && !confirm('Decline this quote?')) return;
  if(accept && !confirm('Accept this quote?')) return;
  try{
    const r=await fetch('/api/quote/'+encodeURIComponent(TOKEN)+'/respond',
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accept})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'Could not save that');
    await load();
  }catch(e){ alert(e.message); }
}

async function payDeposit(btn){
  btn.disabled=true; btn.textContent='Opening secure payment…';
  try{
    const r=await fetch('/api/quote/'+encodeURIComponent(TOKEN)+'/pay',{method:'POST'});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'Could not start the payment');
    location.href=d.url;
  }catch(e){
    alert(e.message);
    btn.disabled=false; btn.textContent='Pay deposit';
  }
}

load();
</script>
</body>
</html>
