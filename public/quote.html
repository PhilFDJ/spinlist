<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Your quote</title>
<style>
/* ------------------------------------------------------------------
   A client-facing document. Two things matter more than styling: it has
   to be legible on a phone, and it has to print sensibly, because some
   people will print a quote before agreeing to it.
   ------------------------------------------------------------------ */
:root{
  --fg:#16181d; --muted:#666b75; --line:#dfe2e8; --paper:#fff; --page:#f4f5f7;
  --accent:#0A1228; --accent-fg:#fff; --good:#1a8a4a; --bad:#b4322a; --warn:#8a6100;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--fg); background:var(--page); line-height:1.55;
  padding:26px 16px 60px; -webkit-text-size-adjust:100%;
}
.wrap{max-width:660px;margin:0 auto}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:26px 24px}

.head{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px}
.head h1{margin:0;font-size:1.3rem;letter-spacing:-.01em}
.head .sub{color:var(--muted);font-size:.9rem;margin-top:4px}

.pill{
  display:inline-block;padding:3px 11px;border-radius:100px;
  font-size:.74rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
}
.pill.sent{background:#eaf0ff;color:#2a4fbf}
.pill.accepted{background:#e6f5ec;color:var(--good)}
.pill.declined{background:#fdecea;color:var(--bad)}
.pill.expired{background:#fdf3e0;color:var(--warn)}

.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.92rem;margin:0 0 22px}
.facts dt{color:var(--muted)}
.facts dd{margin:0}

h2.sec{
  font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin:24px 0 10px;
}

.item{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.item:last-of-type{border-bottom:1px solid var(--line)}
.item img{width:62px;height:62px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:none}
.item .body{flex:1;min-width:0}
.item .name{font-weight:650}
.item .desc{color:var(--muted);font-size:.88rem;margin-top:2px;white-space:pre-wrap}
.item .amt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.item .qty{color:var(--muted);font-size:.82rem}

.totals{margin-top:16px;font-variant-numeric:tabular-nums}
.totals .row{display:flex;justify-content:space-between;padding:5px 0}
.totals .grand{border-top:2px solid var(--fg);margin-top:8px;padding-top:10px;font-size:1.1rem;font-weight:700}
.totals .small{color:var(--muted);font-size:.9rem}

.note{background:#f7f8fa;border-radius:var(--radius);padding:14px 16px;font-size:.92rem;white-space:pre-wrap;margin:18px 0 0}
.sched{font-size:.9rem;color:var(--muted);margin-top:10px}

.actions{margin-top:26px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:650;padding:12px 22px;border:0;border-radius:var(--radius);cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.primary{background:var(--accent);color:var(--accent-fg)}
.primary:hover:not(:disabled){opacity:.9}
.ghost{background:none;color:var(--muted);border:1px solid var(--line)}
.ghost:hover:not(:disabled){color:var(--fg)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.msg{padding:12px 14px;border-radius:var(--radius);font-size:.92rem;margin:0 0 18px;border:1px solid var(--line)}
.msg.bad{border-color:#e6b5b0;background:#fdf3f2;color:var(--bad)}
.msg.good{border-color:#bfe3cd;background:#f1f9f4;color:var(--good)}
.msg[hidden]{display:none}

.after{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.after h3{margin:0 0 6px;font-size:1rem}
.after p{margin:0 0 12px;color:var(--muted);font-size:.92rem}

.loading{color:var(--muted);font-size:.92rem}
.foot{text-align:center;color:var(--muted);font-size:.82rem;margin-top:20px}
[hidden]{display:none !important}

@media (max-width:460px){
  body{padding:14px 10px 40px}
  .card{padding:18px 16px}
  .item img{width:48px;height:48px}
  .actions button{width:100%}
}
@media print{
  body{background:#fff;padding:0}
  .card{border:0;padding:0}
  .actions,.after,.foot{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <p class="loading" id="loading">Loading your quote…</p>
    <div class="msg bad" id="fatal" hidden></div>
    <div id="doc" hidden></div>
  </div>
  <p class="foot" id="foot" hidden></p>
</div>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var params = new URLSearchParams(location.search);
var TOKEN = params.get('q') || '';
var JUST_PAID = params.get('paid') === '1';
var DATA = null;

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function money(p){
  return '£' + ((p || 0) / 100).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function longDate(ts){
  if (!ts) return '';
  return new Date(ts).toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
function shortDate(ts){
  if (!ts) return '';
  return new Date(ts).toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
}
function fatal(m){
  $('loading').hidden = true;
  $('doc').hidden = true;
  $('fatal').textContent = m;
  $('fatal').hidden = false;
}

var STATUS_WORD = { sent:'Awaiting your reply', accepted:'Accepted', declined:'Declined', expired:'Expired' };

function render(){
  var q = DATA.quote, b = DATA.booking, dj = DATA.dj || {};
  var who = dj.company || dj.name || 'Your DJ';
  document.title = 'Quote — ' + who;

  var facts = '';
  if (b){
    if (b.title)      facts += '<dt>Event</dt><dd>' + esc(b.title) + '</dd>';
    if (b.type)       facts += '<dt>Type</dt><dd>' + esc(b.type) + '</dd>';
    if (b.event_date) facts += '<dt>Date</dt><dd>' + esc(longDate(b.event_date)) + '</dd>';
    if (b.venue)      facts += '<dt>Venue</dt><dd>' + esc(b.venue) + '</dd>';
  }

  var items = (q.items || []).map(function(it){
    var line = (it.qty || 1) * (it.unit_pence || 0);
    return '<div class="item">' +
      (it.image ? '<img src="' + esc(it.image) + '" alt="">' : '') +
      '<div class="body"><div class="name">' + esc(it.name) + '</div>' +
      (it.description ? '<div class="desc">' + esc(it.description) + '</div>' : '') +
      ((it.qty || 1) > 1 ? '<div class="qty">' + it.qty + ' × ' + money(it.unit_pence) + '</div>' : '') +
      '</div>' +
      '<div class="amt">' + money(line) + '</div></div>';
  }).join('');

  var totals =
    '<div class="totals">' +
      '<div class="row grand"><span>Total</span><span>' + money(q.total_pence) + '</span></div>' +
      (q.deposit_pence ? '<div class="row small"><span>Deposit to secure the date</span><span>' + money(q.deposit_pence) + '</span></div>' : '') +
      (q.balance_pence ? '<div class="row small"><span>Balance' +
        (q.balance_due_at ? ', due ' + esc(shortDate(q.balance_due_at)) : '') +
        '</span><span>' + money(q.balance_pence) + '</span></div>' : '') +
    '</div>' +
    (q.schedule_text ? '<p class="sched">' + esc(q.schedule_text) + '</p>' : '');

  $('doc').innerHTML =
    '<div class="head">' +
      '<h1>' + esc(who) + '</h1>' +
      '<div class="sub">Quote · <span class="pill ' + esc(q.status) + '">' +
        esc(STATUS_WORD[q.status] || q.status) + '</span></div>' +
    '</div>' +
    '<div class="msg good" id="paid" ' + (JUST_PAID ? '' : 'hidden') + '>' +
      'Thanks — your deposit has been received. Your date is secured.</div>' +
    '<div class="msg bad" id="err" hidden></div>' +
    (facts ? '<dl class="facts">' + facts + '</dl>' : '') +
    '<h2 class="sec">What\u2019s included</h2>' +
    items +
    totals +
    (q.message ? '<div class="note">' + esc(q.message) + '</div>' : '') +
    (q.expires_at && q.status === 'sent'
      ? '<p class="sched">This quote is valid until ' + esc(shortDate(q.expires_at)) + '.</p>' : '') +
    actionsHtml(q) +
    afterHtml(q);

  $('loading').hidden = true;
  $('doc').hidden = false;
  $('foot').textContent = 'Any questions, just reply to the email this came from'
    + (dj.email ? ' or write to ' + dj.email + '.' : '.');
  $('foot').hidden = false;
}

function actionsHtml(q){
  if (q.status !== 'sent') return '';
  return '<div class="actions" id="actions">' +
    '<button class="primary" id="accept">Accept this quote</button>' +
    '<button class="ghost" id="decline">Decline</button>' +
    '</div>' +
    (q.has_contract
      ? '<p class="sched">Accepting will bring up a short agreement to read and sign.</p>'
      : '');
}

/* Shown once a quote is accepted: the two things left to do. Rendered from the
   server's view of the world rather than from what just happened in the
   browser, so a reload shows the same state. */
function afterHtml(q){
  if (q.status === 'declined')
    return '<div class="after"><h3>Quote declined</h3>' +
      '<p>You\u2019ve let us know this one isn\u2019t for you. If that was a mistake, just get in touch.</p></div>';
  if (q.status === 'expired')
    return '<div class="after"><h3>This quote has expired</h3>' +
      '<p>Get in touch and we\u2019ll happily put together a fresh one.</p></div>';
  if (q.status !== 'accepted') return '';

  var h = '<div class="after"><h3>Next steps</h3>';
  if (q.contract_link){
    h += '<p>Please read and sign the agreement.</p>' +
         '<div class="actions"><a href="' + esc(q.contract_link) + '">' +
         '<button class="primary">Read &amp; sign the agreement</button></a></div>';
  }
  if (q.deposit_pence && !JUST_PAID){
    h += '<p style="margin-top:14px">Pay the deposit of ' + money(q.deposit_pence) + ' to secure your date.</p>' +
         '<div class="actions"><button class="primary" id="pay">Pay deposit</button></div>';
  }
  if (!q.contract_link && (!q.deposit_pence || JUST_PAID)){
    h += '<p>All done — we\u2019ll be in touch shortly.</p>';
  }
  return h + '</div>';
}

function showErr(m){
  var e = $('err');
  if (!e) return alert(m);
  e.textContent = m;
  e.hidden = false;
  e.scrollIntoView({ block:'nearest' });
}

function wire(){
  var a = $('accept'), d = $('decline'), p = $('pay');
  if (a) a.addEventListener('click', function(){ respond(true); });
  if (d) d.addEventListener('click', function(){
    if (confirm('Decline this quote? This can\u2019t be undone.')) respond(false);
  });
  if (p) p.addEventListener('click', pay);
}

function respond(accept){
  var btns = document.querySelectorAll('#actions button');
  Array.prototype.forEach.call(btns, function(b){ b.disabled = true; });
  var a = $('accept');
  if (a && accept) a.textContent = 'Accepting…';

  fetch('/api/quote/' + encodeURIComponent(TOKEN) + '/respond', {
    method: 'POST',
    headers: { 'Content-Type':'application/json' },
    body: JSON.stringify({ accept: !!accept })
  })
    .then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(d){
        if (!r.ok) throw new Error(d.error || 'That didn\u2019t go through. Please try again.');
        return d;
      });
    })
    .then(function(d){
      /* Straight to signing if there's something to sign — one fewer step, and
         they're already in the moment of saying yes. */
      if (accept && d.contract_link){ location.href = d.contract_link; return; }
      load();          // otherwise re-read the quote so the page matches the server
    })
    .catch(function(e){
      Array.prototype.forEach.call(btns, function(b){ b.disabled = false; });
      if (a) a.textContent = 'Accept this quote';
      showErr(e.message);
    });
}

function pay(){
  var p = $('pay');
  p.disabled = true;
  p.textContent = 'Opening secure payment…';
  fetch('/api/quote/' + encodeURIComponent(TOKEN) + '/pay', { method:'POST' })
    .then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(d){
        if (!r.ok) throw new Error(d.error || 'Could not start the payment.');
        return d;
      });
    })
    .then(function(d){
      if (d.url) location.href = d.url;
      else throw new Error('Could not start the payment.');
    })
    .catch(function(e){
      p.disabled = false;
      p.textContent = 'Pay deposit';
      showErr(e.message);
    });
}

function load(){
  fetch('/api/quote/' + encodeURIComponent(TOKEN))
    .then(function(r){
      return r.json().then(function(d){
        if (!r.ok) throw new Error(d.error || 'That quote could not be loaded.');
        return d;
      });
    })
    .then(function(d){ DATA = d; render(); wire(); })
    .catch(function(e){ fatal(e.message || 'That quote could not be loaded.'); });
}

if (!TOKEN) fatal('This link is incomplete. Please use the full link from your email.');
else load();
})();
</script>
</body>
</html>
