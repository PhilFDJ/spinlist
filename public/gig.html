<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gig Window · Spinlist</title>
<link rel="icon" href="/img/favicon-32.png" sizes="32x32">
<style>
  :root{ --neon:#c1ff2f; --ink:#e8ecf5; --muted:#8b93a7; --line:rgba(255,255,255,.1); --bg:#070b16; --panel:#0d1424; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;background:var(--neon);color:#0a1228}
  header .title{font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:8px;min-width:0}
  header .title .logo{height:26px;width:auto;flex-shrink:0}
  header .title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header .meta{font-size:.8rem;font-weight:700;opacity:.75;white-space:nowrap}
  main{padding:8px 0 40px}
  .row{padding:16px 22px;border-bottom:1px solid var(--line)}
  .row .q{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--neon);font-weight:800}
  .row .a{font-size:1.35rem;line-height:1.35;color:#fff;margin-top:6px;word-wrap:break-word}
  .row .a.empty{color:#5b6479;font-size:1.05rem;font-style:italic}
  .a-input{width:100%;font-size:1.35rem;line-height:1.35;color:#fff;margin-top:6px;background:transparent;border:none;border-bottom:1px dashed transparent;padding:2px 0;font-family:inherit}
  .a-input::placeholder{color:#5b6479;font-style:italic;font-size:1.05rem}
  .a-input:focus{outline:none;border-bottom-color:var(--neon)}
  .tabs{position:sticky;top:0;display:flex;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
  .tab{flex:1;text-align:center;padding:11px 4px;font-size:.82rem;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
  .tab.on{color:#fff;border-bottom-color:var(--neon)}
  .row.tl{display:flex;gap:12px;align-items:baseline}
  .row.tl .time{color:var(--neon);font-weight:800;font-size:1rem;min-width:70px}
  .row.tl .lbl{color:#fff;font-size:1rem}
  .song{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:1rem;color:#fff}
  .song .tick{width:16px;color:#3a4560;font-weight:800;flex-shrink:0}
  .song .pos{flex-shrink:0}
  .song .tick.done{color:var(--neon)}
  .song .stitle{flex:1}
  .song .copybtn{cursor:pointer;opacity:.7;flex-shrink:0;font-size:.9rem}
  .song .copybtn:hover{opacity:1}
  .song .art{color:#8b93a7}
  .song .pl{color:#8b93a7;text-decoration:line-through}
  .song.empty{color:#5b6479;font-style:italic;font-size:.9rem}
  .status{padding:60px 22px;text-align:center;color:var(--muted)}
  .foot{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line);font-size:.72rem;color:var(--muted)}
  .foot button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 10px;font:inherit;font-size:.72rem;cursor:pointer}
  .foot button:hover{color:var(--ink)}
  /* Now-playing alert. Sits under the header, above everything, because in a
     dark room at 11pm it has to be impossible to miss. */
  #alert{display:none;padding:14px 18px;border-bottom:1px solid var(--line)}
  #alert.on{display:block}
  #alert .what{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;font-weight:800;opacity:.85}
  #alert .track{font-size:1.2rem;font-weight:800;margin-top:4px;line-height:1.3}
  #alert .sub{font-size:.85rem;margin-top:4px;opacity:.85}
  #alert .note{font-size:.85rem;margin-top:8px;padding:8px 10px;background:rgba(0,0,0,.22);border-radius:8px;font-style:italic}
  #alert .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  #alert button{font:inherit;font-weight:800;font-size:.82rem;padding:9px 14px;border:0;border-radius:8px;cursor:pointer}
  #alert .primary{background:#0a1228;color:#fff}
  #alert .ghost{background:rgba(0,0,0,.18);color:inherit}

  #alert.noplay{background:#ff3b30;color:#fff;animation:flash 1s steps(1,end) infinite}
  #alert.maybe{background:#ffb020;color:#241a00;animation:none}
  #alert.good{background:var(--neon);color:#0a1228;animation:none}
  @keyframes flash{0%,100%{background:#ff3b30}50%{background:#8c1108}}
  @media(prefers-reduced-motion:reduce){ #alert.noplay{animation:none} }

  /* Banned blocks in the music list. Marked so a sub-DJ who has never seen this
     wedding before cannot mistake the list for something to play. */
  .row.banned .q{color:#ff6b5e}
  .row.banned .song{color:#ffb4ad}
  .row.banned{background:rgba(255,59,48,.06)}

  @media(max-width:420px){ .row .a{font-size:1.15rem} }
</style>
</head>
<body>
  <header>
    <div class="title"><img src="/img/spinlist-mark-navy.png" alt="Spinlist" class="logo">📺 <span id="wed-name">Gig window</span></div>
    <div class="meta" id="wed-date"></div>
  </header>
  <div class="tabs">
    <span class="tab on" data-tab="info" onclick="setTab('info')">ℹ️ Info</span>
    <span class="tab" data-tab="timeline" onclick="setTab('timeline')">🕐 Timeline</span>
    <span class="tab" data-tab="music" onclick="setTab('music')">🎵 Music</span>
  </div>
  <div id="alert" role="alert" aria-live="assertive"></div>
  <main id="main"><div class="status">Loading…</div></main>
  <div class="foot"><span id="updated">—</span><button onclick="load()">Refresh now</button></div>
<script>
const params=new URLSearchParams(location.search);
const WID=params.get('w');
const EID=params.get('e');
let LAST_ANSWERS={};
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let WED=null, TAB='info';
function setTab(t){
  TAB=t;
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('on',el.dataset.tab===t));
  if(WED)renderBody();
}
function infoHtml(){
  const q=WED.questionnaire, answers=WED.answers||{};
  const flagged=((q&&q.questions)||[]).filter(qq=>qq.gigShow&&qq.type!=='header');
  if(!flagged.length)return '<div class="status">No questions are flagged for the gig window yet.<br>Tick “📺 Gig window” on questions in your template, then save.</div>';
  return flagged.map(qq=>{
    const a=answers[qq.id]||'';
    return '<div class="row"><div class="q">'+esc(qq.label)+'</div>'+
      '<input class="a-input" value="'+esc(a)+'" placeholder="tap to add…" data-qid="'+esc(qq.id)+'" onchange="saveAnswer(this.dataset.qid,this.value)"></div>';
  }).join('');
}
function timelineHtml(){
  const tl=(WED.timeline||[]);
  if(!tl.length)return '<div class="status">No timeline added yet.</div>';
  return tl.map(t=>'<div class="row tl"><div class="time">'+esc(t.time||'')+'</div><div class="lbl">'+esc(t.label||'')+'</div></div>').join('');
}
function musicHtml(){
  const blocks=(WED.blocks||[]);
  if(!blocks.length)return '<div class="status">No music blocks yet.</div>';
  return blocks.map(b=>{
    const songs=(b.songs||[]);
    /* A banned block gets no play ticks — ticking "played" against a song the
       couple forbade is meaningless, and a tappable tick invites the mistake. */
    if(b.noplay){
      const banned=songs.length?songs.map(s=>
        '<div class="song"><span class="tick">⛔</span><span class="stitle">'+esc(s.title||'')+
        (s.artist?' <span class="art">· '+esc(s.artist)+'</span>':'')+'</span></div>'
      ).join(''):'<div class="song empty">Nothing listed</div>';
      return '<div class="row banned"><div class="q">⛔ '+esc(b.name||'Do not play')+
        ' <span class="art">(never play these)</span></div>'+banned+'</div>';
    }
    const list=songs.length?songs.map(s=>{
      const copyTxt=(s.title||'')+(s.artist?' '+s.artist:'');
      return '<div class="song">'+
        '<span class="tick '+(s.played?'done':'')+'" onclick="togglePlayed(\''+esc(b.id)+'\',\''+esc(s.id)+'\','+(s.played?0:1)+')" style="cursor:pointer">'+(s.played?'✓':'○')+'</span>'+
        '<span class="stitle'+(s.played?' pl':'')+'" onclick="togglePlayed(\''+esc(b.id)+'\',\''+esc(s.id)+'\','+(s.played?0:1)+')" style="cursor:pointer">'+esc(s.title||'')+(s.artist?' <span class="art">· '+esc(s.artist)+'</span>':'')+'</span>'+
        '<span class="copybtn" title="Copy title & artist" onclick="copySong(this,\''+esc(copyTxt).replace(/'/g,"\\'")+'\')">📋</span>'+
      '</div>';
    }).join(''):'<div class="song empty">No songs chosen</div>';
    return '<div class="row"><div class="q">'+esc(b.name||'Block')+' <span class="art">('+songs.filter(s=>s.played).length+'/'+songs.length+' played)</span></div>'+list+'</div>';
  }).join('');
}
/* ---------------- NOW PLAYING ALERT ----------------
   Music Manager reads Serato's history file and posts the track to the server,
   which works out the verdict. This window polls for it. Polling rather than a
   socket because venue wifi drops constantly and a dead socket fails silently,
   whereas a failed poll just tries again in four seconds. */
let NP_SEEN=0;          // timestamp of the last alert we've already shown
let NP_DISMISSED=0;     // and the last one the DJ waved away

function alertBox(){ return document.getElementById('alert'); }

function hideAlert(){
  const a=alertBox();
  a.className='';
  a.innerHTML='';
}

function showNowPlaying(np){
  const a=alertBox();
  const t=np.played||{};
  const heard=esc(t.title||'')+(t.artist?' · '+esc(t.artist):'');

  if(np.verdict==='noplay'){
    a.className='on noplay';
    a.innerHTML='<div class="what">⛔ Do not play</div>'+
      '<div class="track">'+heard+'</div>'+
      '<div class="sub">On the '+esc((np.block&&np.block.name)||'do-not-play')+' list'+
        (np.confidence==='loose'?' — close match, worth a look':'')+'</div>'+
      ((np.song&&np.song.note_couple)?'<div class="note">“'+esc(np.song.note_couple)+'”</div>':'')+
      '<div class="acts"><button class="primary" onclick="dismissAlert()">Got it</button></div>';
    return;
  }

  if(np.verdict==='maybe'){
    a.className='on maybe';
    a.innerHTML='<div class="what">Was that this one?</div>'+
      '<div class="track">'+esc(np.song?np.song.title:'')+
        (np.song&&np.song.artist?' · '+esc(np.song.artist):'')+'</div>'+
      '<div class="sub">Heard: '+heard+' — in '+esc((np.block&&np.block.name)||'')+'</div>'+
      '<div class="acts">'+
        '<button class="primary" onclick="confirmMaybe(\''+esc(np.block?np.block.id:'')+'\',\''+esc(np.song?np.song.id:'')+'\')">Yes, tick it</button>'+
        '<button class="ghost" onclick="dismissAlert()">No</button>'+
      '</div>';
    return;
  }

  if(np.verdict==='planned'&&np.marked){
    a.className='on good';
    a.innerHTML='<div class="what">✓ Ticked off</div><div class="track">'+
      esc(np.song?np.song.title:heard)+'</div>'+
      '<div class="sub">'+esc((np.block&&np.block.name)||'')+'</div>';
    // A confirmation doesn't need dismissing — it gets out of the way itself.
    setTimeout(()=>{ if(alertBox().classList.contains('good')) hideAlert(); },6000);
    return;
  }
  hideAlert();   // 'unknown' — most of a night is filler, don't nag about it
}

async function pollNowPlaying(){
  if(!WID) return;
  try{
    const r=await fetch('/api/weddings/'+encodeURIComponent(WID)+'/now-playing',{credentials:'same-origin'});
    if(!r.ok) return;
    const d=await r.json();
    const np=d&&d.now_playing;
    if(!np||!np.at){ hideAlert(); return; }
    if(np.at===NP_DISMISSED) return;             // already waved away
    if(np.at===NP_SEEN) return;                  // already on screen
    NP_SEEN=np.at;
    showNowPlaying(np);
    if(np.marked) load();                        // the tick came from the server
  }catch(e){ /* wifi — try again in four seconds */ }
}

async function dismissAlert(){
  NP_DISMISSED=NP_SEEN;
  hideAlert();
  try{
    await fetch('/api/weddings/'+encodeURIComponent(WID)+'/now-playing',
      {method:'DELETE',credentials:'same-origin'});
  }catch(e){}
}

async function confirmMaybe(blockId,songId){
  await dismissAlert();
  if(blockId&&songId) togglePlayed(blockId,songId,1);
}

async function togglePlayed(blockId,songId,played){
  try{
    const r=await fetch('/api/weddings/'+encodeURIComponent(WID)+'/played',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({blockId,songId,played:!!played})});
    if(r.ok){ const d=await r.json(); if(d&&d.wedding){ WED=d.wedding; renderBody(); document.getElementById('updated').textContent='Saved '+new Date().toLocaleTimeString(); } }
    else{ document.getElementById('updated').textContent='Save failed'; }
  }catch(e){ document.getElementById('updated').textContent='Save failed'; }
}
async function copySong(el,text){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){ const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(_){}document.body.removeChild(ta); }
  if(el){ const o=el.textContent; el.textContent='✓'; setTimeout(()=>{el.textContent=o;},900); }
  document.getElementById('updated').textContent='Copied: '+text;
}
function renderBody(){
  document.getElementById('main').innerHTML = TAB==='timeline'?timelineHtml() : TAB==='music'?musicHtml() : infoHtml();
}
function paint(w){
  WED=w;
  document.getElementById('wed-name').textContent=w.coupleNames||w.name||'Gig window';
  document.getElementById('wed-date').textContent=w.weddingDate?new Date(w.weddingDate).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'';
  document.title='📺 '+(w.coupleNames||w.name||'Gig')+' · Spinlist';
  LAST_ANSWERS=Object.assign({},w.answers||{});
  renderBody();
  document.getElementById('updated').textContent='Updated '+new Date().toLocaleTimeString();
}
async function saveAnswer(qid,val){
  LAST_ANSWERS[qid]=val;
  try{
    const r=await fetch('/api/weddings/'+encodeURIComponent(WID)+'/answers',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({answers:LAST_ANSWERS})});
    if(r.ok){ const d=await r.json(); if(d&&d.wedding){ WED=d.wedding; LAST_ANSWERS=d.wedding.answers||LAST_ANSWERS; } document.getElementById('updated').textContent='Saved '+new Date().toLocaleTimeString(); }
    else{ document.getElementById('updated').textContent='Save failed'; }
  }catch(e){ document.getElementById('updated').textContent='Save failed'; }
}
async function load(){
  if(EID){ return loadEvent(); }
  const main=document.getElementById('main');
  // Prefer seeded data handed over by the opener (always matches the in-page window).
  if(window.__SEED_WEDDING){ try{ paint(window.__SEED_WEDDING); }catch(e){} }
  if(!WID){ if(!window.__SEED_WEDDING)main.innerHTML='<div class="status">No wedding specified.</div>'; return; }
  try{
    const r=await fetch('/api/weddings/'+encodeURIComponent(WID),{credentials:'same-origin'});
    if(r.status===401||r.status===403){ if(!window.__SEED_WEDDING)main.innerHTML='<div class="status">Please <a href="/" style="color:var(--neon)">log in</a> on the main site, then reopen this window.</div>'; return; }
    if(!r.ok){ if(!window.__SEED_WEDDING)main.innerHTML='<div class="status">Could not load this wedding.</div>'; return; }
    const d=await r.json();
    if(d&&d.wedding)paint(d.wedding);
  }catch(e){ if(!window.__SEED_WEDDING)main.innerHTML='<div class="status">Connection problem — will retry.</div>'; }
}

/* ---- Event mode (voted song list) ---- */
let EV=null, EV_SORT='voted';
function setEvSort(m){ EV_SORT=m; document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('on',el.dataset.tab===m)); renderEvent(); }
function evTracks(){
  const list=(EV.tracks||[]).slice();
  if(EV_SORT==='newest')return list.sort((a,b)=>(b.addedAt||0)-(a.addedAt||0));
  if(EV_SORT==='oldest')return list.sort((a,b)=>(a.addedAt||0)-(b.addedAt||0));
  return list.sort((a,b)=>b.votes-a.votes);
}
function renderEvent(){
  const main=document.getElementById('main');
  const list=evTracks();
  if(!list.length){ main.innerHTML='<div class="status">No songs voted yet.</div>'; return; }
  main.innerHTML=list.map((t,i)=>{
    const copyTxt=(t.title||'')+(t.artist?' '+t.artist:'');
    return '<div class="song">'+
      '<span class="pos" style="color:#8b93a7;font-weight:800;width:20px;text-align:right;font-size:.8rem;flex-shrink:0">'+(EV_SORT==='voted'?(i+1):'•')+'</span>'+
      '<span class="tick '+(t.played?'done':'')+'" onclick="evPlayed(\''+esc(t.id)+'\','+(t.played?0:1)+')" style="cursor:pointer">'+(t.played?'✓':'○')+'</span>'+
      '<span class="stitle'+(t.played?' pl':'')+'" onclick="evPlayed(\''+esc(t.id)+'\','+(t.played?0:1)+')" style="cursor:pointer">'+esc(t.title||'')+(t.artist?' <span class="art">· '+esc(t.artist)+'</span>':'')+'</span>'+
      '<span class="art" style="color:var(--neon);font-weight:700;font-size:.8rem">'+t.votes+'</span>'+
      '<span class="copybtn" title="Copy title & artist" onclick="copySong(this,\''+esc(copyTxt).replace(/\'/g,"\\'")+'\')">📋</span>'+
    '</div>';
  }).join('');
  document.getElementById('updated').textContent='Updated '+new Date().toLocaleTimeString();
}
async function evPlayed(id,played){
  try{
    const r=await fetch('/api/events/'+encodeURIComponent(EID)+'/played',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({trackId:id,played:!!played})});
    if(r.ok){ const d=await r.json(); if(d&&d.event){ EV=d.event; renderEvent(); document.getElementById('updated').textContent='Saved '+new Date().toLocaleTimeString(); } }
    else{ document.getElementById('updated').textContent='Save failed'; }
  }catch(e){ document.getElementById('updated').textContent='Save failed'; }
}
async function loadEvent(){
  const main=document.getElementById('main');
  // Swap the tab bar to sort options (once).
  const tabs=document.querySelector('.tabs');
  if(tabs && !tabs.dataset.ev){ tabs.dataset.ev='1';
    tabs.innerHTML='<span class="tab on" data-tab="voted" onclick="setEvSort(\'voted\')">Top voted</span>'+
      '<span class="tab" data-tab="newest" onclick="setEvSort(\'newest\')">Newest</span>'+
      '<span class="tab" data-tab="oldest" onclick="setEvSort(\'oldest\')">Oldest</span>';
  }
  try{
    const r=await fetch('/api/events/'+encodeURIComponent(EID),{credentials:'same-origin'});
    if(r.status===401||r.status===403){ main.innerHTML='<div class="status">Please <a href="/" style="color:var(--neon)">log in</a> on the main site, then reopen this window.</div>'; return; }
    if(!r.ok){ main.innerHTML='<div class="status">Could not load this event.</div>'; return; }
    const d=await r.json();
    if(d&&d.event){ EV=d.event; document.getElementById('wed-name').textContent=EV.name||'Event'; document.getElementById('wed-date').textContent=''; document.title='📺 '+(EV.name||'Event')+' · Spinlist'; renderEvent(); }
  }catch(e){ main.innerHTML='<div class="status">Connection problem — will retry.</div>'; }
}
load();
setInterval(load,30000);        // full refresh every 30s
pollNowPlaying();
setInterval(pollNowPlaying,4000);   // the alert needs to be quicker than that
</script>
<script src="/js/track.js"></script>
</body>
</html>
