<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Enquiry form</title>
<style>
/* ------------------------------------------------------------------
   This page has two jobs and they pull in opposite directions.

   EMBEDDED (in an iframe on a DJ's own website): it must look like it
   belongs to the host page, not to Spinlist. No logo, no heading, no
   background, and the font is inherited. Every colour is a CSS variable
   so the host can override them from their own stylesheet.

   STANDALONE (someone opens the link directly): there is no host page to
   provide branding, so it wears Spinlist's.
   ------------------------------------------------------------------ */
:root{
  --sl-fg:#16181d;
  --sl-muted:#666b75;
  --sl-line:#d9dce2;
  --sl-line-strong:#b6bcc6;
  --sl-field-bg:#fff;
  --sl-accent:#0A1228;
  --sl-accent-fg:#fff;
  --sl-error:#b4322a;
  --sl-error-bg:#fdf3f2;
  --sl-radius:8px;
  --sl-gap:18px;
  --sl-font:inherit;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sl-font);
  color:var(--sl-fg);
  background:transparent;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
}
/* Standalone gets a page: a background, a card, and a real font stack. */
body.standalone{
  --sl-font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:#f4f5f7;
  padding:28px 16px 56px;
}
.wrap{max-width:600px;margin:0 auto}
body.standalone .wrap{
  background:#fff;
  border:1px solid var(--sl-line);
  border-radius:14px;
  padding:30px 28px 34px;
}
.brand{display:none}
body.standalone .brand{
  display:block;
  margin:0 0 22px;
  padding-bottom:18px;
  border-bottom:1px solid var(--sl-line);
}
.brand h1{margin:0;font-size:1.35rem;letter-spacing:-.01em}
.brand p{margin:4px 0 0;color:var(--sl-muted);font-size:.9rem}

fieldset{border:0;margin:0 0 var(--sl-gap);padding:0;min-width:0}
legend{
  padding:0;margin:0 0 10px;
  font-size:.75rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--sl-muted);
}
.row{margin:0 0 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:460px){.two{grid-template-columns:1fr}}

label{display:block;font-size:.875rem;font-weight:600;margin:0 0 5px}
.req{color:var(--sl-error);font-weight:400}
.hint{display:block;font-weight:400;color:var(--sl-muted);font-size:.8rem;margin-top:2px}

input[type=text],input[type=email],input[type=tel],input[type=date],
input[type=time],input[type=number],select,textarea{
  width:100%;
  font:inherit;
  color:inherit;
  padding:9px 11px;
  border:1px solid var(--sl-line-strong);
  border-radius:var(--sl-radius);
  background:var(--sl-field-bg);
}
textarea{min-height:96px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{
  outline:2px solid var(--sl-accent);
  outline-offset:1px;
}
.money{position:relative}
.money input{padding-left:26px}
.money span{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--sl-muted);pointer-events:none;
}
.check{display:flex;gap:9px;align-items:flex-start}
.check input{margin:3px 0 0;flex:none}
.check label{font-weight:400;margin:0}

/* Address autocomplete. A plain listbox — no third-party widget, because the
   lookup is proxied through our own server to keep the API key private. */
.ac{position:relative}
.ac-list{
  position:absolute;z-index:20;left:0;right:0;top:calc(100% + 3px);
  margin:0;padding:4px;list-style:none;
  background:#fff;border:1px solid var(--sl-line-strong);
  border-radius:var(--sl-radius);
  box-shadow:0 6px 20px rgba(20,24,32,.13);
  max-height:250px;overflow:auto;
}
.ac-list[hidden]{display:none}
.ac-list li{padding:8px 9px;border-radius:5px;cursor:pointer;font-size:.9rem}
.ac-list li[aria-selected=true],.ac-list li:hover{background:#eef0f4}
.ac-list b{display:block;font-weight:600}
.ac-list small{color:var(--sl-muted)}

button.go{
  font:inherit;font-weight:650;
  padding:12px 22px;
  border:0;border-radius:var(--sl-radius);
  background:var(--sl-accent);color:var(--sl-accent-fg);
  cursor:pointer;
}
button.go:hover:not(:disabled){opacity:.9}
button.go:disabled{opacity:.55;cursor:default}

.msg{
  padding:11px 13px;border-radius:var(--sl-radius);
  border:1px solid var(--sl-line);
  font-size:.9rem;margin:0 0 var(--sl-gap);
}
.msg.bad{border-color:#e6b5b0;background:var(--sl-error-bg);color:var(--sl-error)}
.msg[hidden]{display:none}

.intro{margin:0 0 var(--sl-gap);font-size:.94rem;color:var(--sl-muted)}
.intro p{margin:0 0 8px}
.intro p:last-child{margin:0}
.done{padding:8px 0}
.done h2{margin:0 0 8px;font-size:1.15rem}
.done p{margin:0;color:var(--sl-muted)}

.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.loading{color:var(--sl-muted);font-size:.9rem;padding:8px 0}
[hidden]{display:none !important}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand" id="brand"></div>
  <p class="loading" id="loading">Loading the form…</p>
  <div class="msg bad" id="fatal" hidden></div>
  <div class="intro" id="intro" hidden></div>

  <form id="form" hidden novalidate>
    <div class="msg bad" id="err" hidden></div>

    <fieldset>
      <legend>Your details</legend>
      <div class="row">
        <label for="f-name">Your name <span class="req" aria-hidden="true">*</span></label>
        <input id="f-name" name="name" type="text" autocomplete="name" required>
      </div>
      <div class="two">
        <div class="row">
          <label for="f-email">Email <span class="req" aria-hidden="true">*</span></label>
          <input id="f-email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="row">
          <label for="f-phone">Phone</label>
          <input id="f-phone" name="phone" type="tel" autocomplete="tel">
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>The event</legend>
      <div class="two">
        <div class="row">
          <label for="f-type">What kind of event?</label>
          <select id="f-type" name="event_type"></select>
        </div>
        <div class="row">
          <label for="f-date">Date <span class="hint">Leave blank if you're not sure yet</span></label>
          <input id="f-date" name="event_date" type="date">
        </div>
      </div>
      <div class="two" id="partners" hidden>
        <div class="row">
          <label for="f-pa">First name</label>
          <input id="f-pa" name="partner_a_name" type="text">
        </div>
        <div class="row">
          <label for="f-pb">Partner's first name</label>
          <input id="f-pb" name="partner_b_name" type="text">
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Venue</legend>
      <div class="row ac">
        <label for="f-venue">Venue name or address
          <span class="hint" id="venue-hint">Start typing and pick from the list</span>
        </label>
        <input id="f-venue" name="venue_name" type="text" autocomplete="off"
               role="combobox" aria-expanded="false" aria-autocomplete="list"
               aria-controls="ac-list">
        <ul class="ac-list" id="ac-list" role="listbox" hidden></ul>
      </div>
      <div class="row">
        <label for="f-addr">Address</label>
        <input id="f-addr" name="venue_address" type="text" autocomplete="off">
      </div>
    </fieldset>

    <fieldset id="extra-wrap" hidden>
      <legend id="extra-legend">A few more details</legend>
      <div id="extra"></div>
    </fieldset>

    <fieldset id="q-wrap" hidden>
      <legend id="q-legend">A few more details</legend>
      <div id="questions"></div>
    </fieldset>

    <fieldset>
      <legend>Anything else</legend>
      <div class="row">
        <label for="f-msg">Tell us about your event</label>
        <textarea id="f-msg" name="message"></textarea>
      </div>
    </fieldset>

    <!-- Spam trap. Real people never fill this in; bots fill everything. -->
    <div class="hp" aria-hidden="true">
      <label for="f-website">Website</label>
      <input id="f-website" name="website" type="text" tabindex="-1" autocomplete="off">
    </div>

    <button class="go" id="send" type="submit">Send enquiry</button>
  </form>

  <div class="done" id="done" hidden>
    <h2 id="done-h">Thanks — that's come through</h2>
    <p id="done-p">We'll be in touch shortly. Do check your junk folder if you don't hear anything.</p>
  </div>
</div>

<script>
(function(){
'use strict';

var $ = function(id){ return document.getElementById(id); };
var params = new URLSearchParams(location.search);
var TOKEN = params.get('f') || '';

/* Embedded unless proved otherwise. Cross-origin framing throws on
   window.top access, which is itself the answer. */
var EMBEDDED = (function(){
  if (params.get('embed') === '1') return true;
  if (params.get('embed') === '0') return false;
  try { return window.self !== window.top; } catch (e) { return true; }
})();
if (!EMBEDDED) document.body.className = 'standalone';

/* ---- iframe height ----------------------------------------------------
   A fixed-height iframe gives the form its own inner scrollbar, which looks
   broken on someone's website. Broadcast our height and let the host resize.
   Hosts that ignore it are no worse off than a fixed height. */
function tellHeight(){
  if (!EMBEDDED) return;
  var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
  try {
    parent.postMessage({ type:'spinlist:enquiry:height', height:h, token:TOKEN }, '*');
  } catch (e) {}
}
if (EMBEDDED){
  if (window.ResizeObserver) new ResizeObserver(tellHeight).observe(document.documentElement);
  window.addEventListener('load', tellHeight);
  setInterval(tellHeight, 1000);   // belt and braces: fonts, images, slow reflows
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fatal(m){
  $('loading').hidden = true;
  $('form').hidden = true;
  $('fatal').textContent = m;
  $('fatal').hidden = false;
  tellHeight();
}
function showErr(m){
  var e = $('err');
  e.textContent = m;
  e.hidden = false;
  e.scrollIntoView({ block:'nearest' });
  tellHeight();
}

/* Public-facing event types. Deliberately NOT db.sessionTypes() — that list is
   internal scheduling vocabulary ("Setup", "Unavailable") and means nothing to
   a client. Per-form configuration replaces this hardcoded list. */
var EVENT_TYPES = ['Wedding','Corporate event','Birthday party','Anniversary',
                   'Christmas party','School prom','Other'];

var FIELDS = [], QUESTIONS = [];

function fieldHtml(f, prefix){
  var id = (prefix || 'x-') + f.key;
  var name = f.name || f.label || '';
  var lab = '<label for="' + esc(id) + '">' + esc(name) +
            (f.required ? ' <span class="req" aria-hidden="true">*</span>' : '') + '</label>';
  var t = f.type;

  if (t === 'textarea') return '<div class="row">' + lab + '<textarea id="' + esc(id) + '"></textarea></div>';
  if (t === 'number')   return '<div class="row">' + lab + '<input id="' + esc(id) + '" type="number" step="any"></div>';
  if (t === 'date')     return '<div class="row">' + lab + '<input id="' + esc(id) + '" type="date"></div>';
  if (t === 'time')     return '<div class="row">' + lab + '<input id="' + esc(id) + '" type="time"></div>';
  if (t === 'address')  return '<div class="row ac">' + lab +
                               '<input id="' + esc(id) + '" type="text" autocomplete="off" data-places="1"' +
                               ' role="combobox" aria-expanded="false" aria-autocomplete="list">' +
                               '<span class="hint" data-for="' + esc(id) + '"></span></div>';
  if (t === 'money')    return '<div class="row">' + lab + '<div class="money"><span>&pound;</span><input id="' + esc(id) + '" type="number" step="0.01" min="0"></div></div>';
  if (t === 'checkbox') return '<div class="row check"><input id="' + esc(id) + '" type="checkbox"><label for="' + esc(id) + '">' + esc(name) + '</label></div>';
  if (t === 'dropdown'){
    var opts = ['<option value="">Please choose…</option>'].concat(
      (f.options || []).map(function(o){ return '<option value="' + esc(o) + '">' + esc(o) + '</option>'; })
    ).join('');
    return '<div class="row">' + lab + '<select id="' + esc(id) + '">' + opts + '</select></div>';
  }
  return '<div class="row">' + lab + '<input id="' + esc(id) + '" type="text"></div>';
}

function readField(f, prefix){
  var el = $((prefix || 'x-') + f.key);
  if (!el) return null;
  if (f.type === 'checkbox') return el.checked ? true : null;
  var v = (el.value || '').trim();
  return v === '' ? null : v;
}

/* ---- load the form definition --------------------------------------- */
if (!TOKEN){
  fatal('This form link is incomplete. Please use the full link you were given.');
} else {
  fetch('/api/enquire/' + encodeURIComponent(TOKEN) + '/form')
    .then(function(r){
      return r.json().then(function(d){
        if (!r.ok) throw new Error(d.error || 'That form could not be loaded.');
        return d;
      });
    })
    .then(function(d){
      FIELDS = Array.isArray(d.fields) ? d.fields : [];

      var dj = d.dj || {};
      var form = d.form || null;
      var who = dj.company || dj.name || '';
      if (who){
        $('brand').innerHTML = '<h1>' + esc(who) + '</h1><p>' +
          esc((form && form.name) || 'Tell us about your event') + '</p>';
        document.title = 'Enquiry — ' + who;
      }
      // Intro copy is the DJ's own words, so paragraphs are honoured but no
      // markup is: it is escaped first, then split on blank lines.
      if (form && form.intro){
        $('intro').innerHTML = form.intro.split(/\n\s*\n/).map(function(para){
          return '<p>' + esc(para).replace(/\n/g, '<br>') + '</p>';
        }).join('');
        $('intro').hidden = false;
      }
      if (form && form.thanks){
        $('done-h').textContent = 'Thanks — that\u2019s come through';
        $('done-p').textContent = form.thanks;
      }

      var sel = $('f-type');
      sel.innerHTML = EVENT_TYPES.map(function(t){
        return '<option value="' + esc(t) + '">' + esc(t) + '</option>';
      }).join('');

      // Partner names are a wedding question. Asking a corporate client for
      // their partner's name is the kind of detail that loses you the job.
      function syncPartners(){ $('partners').hidden = sel.value !== 'Wedding'; tellHeight(); }
      sel.addEventListener('change', syncPartners);
      syncPartners();

      if (FIELDS.length){
        $('extra').innerHTML = FIELDS.map(function(f){ return fieldHtml(f, 'x-'); }).join('');
        $('extra-wrap').hidden = false;
      }
      QUESTIONS = Array.isArray(d.questions) ? d.questions : [];
      if (QUESTIONS.length){
        $('questions').innerHTML = QUESTIONS.map(function(q){ return fieldHtml(q, 'q-'); }).join('');
        $('q-wrap').hidden = false;
        // Two "more details" headings in a row reads as a mistake.
        if (FIELDS.length) $('q-legend').textContent = 'And a little more';
      }

      $('loading').hidden = true;
      $('form').hidden = false;
      tellHeight();
      setupAddress();
    })
    .catch(function(e){ fatal(e.message || 'That form could not be loaded.'); });
}

/* ---- address lookup --------------------------------------------------
   Attachable to ANY input, so the venue box and every address question get the
   same map-backed lookup rather than one being special. A session token spans
   the keystrokes and is closed by the details call, which is what keeps the
   lookups inside the free tier. */
var PLACES_ON = false;

function attachPlaces(input, list, onPick){
  var session = null, timer = null, items = [], cursor = -1;

  function newSession(){
    session = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
            : String(Date.now()) + Math.random().toString(36).slice(2);
  }
  function close(){
    list.hidden = true;
    input.setAttribute('aria-expanded','false');
    items = []; cursor = -1;
    tellHeight();
  }
  function draw(){
    if (!items.length) return close();
    list.innerHTML = items.map(function(p,i){
      return '<li role="option" aria-selected="' + (i===cursor) + '">' +
             '<b>' + esc(p.main) + '</b>' +
             (p.secondary ? '<small>' + esc(p.secondary) + '</small>' : '') + '</li>';
    }).join('');
    list.hidden = false;
    input.setAttribute('aria-expanded','true');
    tellHeight();
  }
  function choose(i){
    var p = items[i];
    if (!p) return;
    fetch('/api/places/details?id=' + encodeURIComponent(p.id) + '&token=' + encodeURIComponent(session || ''))
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){ onPick(d || { name: p.main, address: p.secondary || '' }, p); })
      .catch(function(){ onPick({ name: p.main, address: p.secondary || '' }, p); })
      .then(function(){ newSession(); close(); });
  }

  newSession();
  input.addEventListener('input', function(){
    clearTimeout(timer);
    var q = input.value.trim();
    if (q.length < 3) return close();
    // Debounced: billed per session rather than per keystroke, but there's still
    // no reason to fire a request on every letter.
    timer = setTimeout(function(){
      fetch('/api/places/autocomplete?q=' + encodeURIComponent(q) + '&token=' + encodeURIComponent(session || ''))
        .then(function(r){ return r.json(); })
        .then(function(d){ items = (d && d.predictions) || []; cursor = -1; draw(); })
        .catch(close);
    }, 250);
  });
  input.addEventListener('keydown', function(ev){
    if (list.hidden) return;
    if (ev.key === 'ArrowDown'){ ev.preventDefault(); cursor = Math.min(cursor+1, items.length-1); draw(); }
    else if (ev.key === 'ArrowUp'){ ev.preventDefault(); cursor = Math.max(cursor-1, 0); draw(); }
    else if (ev.key === 'Enter' && cursor >= 0){ ev.preventDefault(); choose(cursor); }
    else if (ev.key === 'Escape'){ close(); }
  });
  list.addEventListener('mousedown', function(ev){
    var li = ev.target.closest('li');
    if (!li) return;
    ev.preventDefault();
    choose(Array.prototype.indexOf.call(list.children, li));
  });
  document.addEventListener('click', function(ev){
    if (input !== ev.target && !list.contains(ev.target)) close();
  });
}

function makeList(after){
  var ul = document.createElement('ul');
  ul.className = 'ac-list';
  ul.setAttribute('role','listbox');
  ul.hidden = true;
  after.parentNode.appendChild(ul);
  return ul;
}

/* Wire up the venue pair plus every address-type question. Called after the
   form definition has rendered, since the address inputs don't exist before. */
function setupAddress(){
  var venue = $('f-venue'), addr = $('f-addr'), hint = $('venue-hint');

  fetch('/api/places/enabled')
    .then(function(r){ return r.json(); })
    .then(function(d){ return !!(d && d.enabled); })
    .catch(function(){ return false; })
    .then(function(on){
      PLACES_ON = on;
      if (!on){
        // No key configured: the boxes still work, they're just typed by hand.
        hint.textContent = 'Where is the event being held?';
        document.querySelectorAll('.hint[data-for]').forEach(function(el){
          el.textContent = 'Type the full address';
        });
        return;
      }
      attachPlaces(venue, $('ac-list'), function(det){
        venue.value = det.name || venue.value;
        addr.value = det.address || '';
      });
      document.querySelectorAll('input[data-places="1"]').forEach(function(el){
        var h = document.querySelector('.hint[data-for="' + el.id + '"]');
        if (h) h.textContent = 'Start typing and pick from the list';
        attachPlaces(el, makeList(el), function(det){
          // A single box wants the full postal address, not just the name.
          el.value = det.address || det.name || el.value;
        });
      });
    });
}

/* ---- submit ---------------------------------------------------------- */
$('form').addEventListener('submit', function(ev){
  ev.preventDefault();
  $('err').hidden = true;

  var name  = $('f-name').value.trim();
  var email = $('f-email').value.trim();
  if (!name){ showErr('Please add your name.'); $('f-name').focus(); return; }
  if (!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){
    showErr('That email address doesn\u2019t look right.'); $('f-email').focus(); return;
  }

  var custom = {};
  FIELDS.forEach(function(f){
    var v = readField(f, 'x-');
    if (v !== null) custom[f.key] = v;
  });

  var answers = {};
  var missing = null;
  QUESTIONS.forEach(function(q){
    var v = readField(q, 'q-');
    if (v !== null) answers[q.key] = v;
    else if (q.required && !missing) missing = q;
  });
  if (missing){
    showErr('Please answer: ' + missing.label);
    var el = $('q-' + missing.key);
    if (el) el.focus();
    return;
  }

  var body = {
    name: name,
    email: email,
    phone: $('f-phone').value.trim(),
    event_type: $('f-type').value,
    event_date: $('f-date').value || '',
    venue_name: $('f-venue').value.trim(),
    venue_address: $('f-addr').value.trim(),
    partner_a_name: $('partners').hidden ? '' : $('f-pa').value.trim(),
    partner_b_name: $('partners').hidden ? '' : $('f-pb').value.trim(),
    message: $('f-msg').value.trim(),
    website: $('f-website').value,   // honeypot, sent as-is
    custom: custom,
    answers: answers
  };

  var btn = $('send');
  btn.disabled = true;
  btn.textContent = 'Sending…';

  fetch('/api/enquire/' + encodeURIComponent(TOKEN), {
    method: 'POST',
    headers: { 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  })
    .then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(d){
        if (!r.ok) throw new Error(d.error || 'That didn\u2019t send. Please try again.');
        return d;
      });
    })
    .then(function(){
      $('form').hidden = true;
      $('intro').hidden = true;
      $('done').hidden = false;
      tellHeight();
      $('done-h').setAttribute('tabindex','-1');
      $('done-h').focus();
    })
    .catch(function(e){
      btn.disabled = false;
      btn.textContent = 'Send enquiry';
      showErr(e.message);
    });
});
})();
</script>
</body>
</html>
