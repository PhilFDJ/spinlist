<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spinlist — Bookings</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="/img/favicon-180.png">
<style>
  :root{--ink:#eaf0ff;--ink-2:#b6c2e0;--paper:#0a1228;--paper-2:#121d3d;--surface:#16234a;--neon:#c6f24e;--neon-dim:#a8d63f;--plum:#5b8cff;--coral:#ff6b5e;--gold:#e9c46a;--muted:#7e8db5;--line:rgba(180,200,255,.16);--shadow:0 18px 50px -22px rgba(0,0,0,.7)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Helvetica Neue",Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink)}
  .wrap{max-width:1240px;margin:0 auto;padding:0 22px}
  header.bar{background:rgba(10,18,40,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .bar .wrap{display:flex;align-items:center;justify-content:space-between;height:74px;max-width:1240px}
  .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
  .logo-img{height:54px;width:auto;display:block}
  .btn{font:inherit;font-weight:700;border:0;border-radius:100px;padding:12px 22px;cursor:pointer;font-size:.92rem;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:transform .15s}
  .btn:hover{transform:translateY(-2px)}
  .btn-neon{background:var(--neon);color:#0a1228}
  .btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
  .btn-sm{padding:8px 14px;font-size:.82rem}
  .btn-danger{background:transparent;color:var(--coral);border:1.5px solid var(--coral)}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:20px}
  h1{font-size:2.2rem;margin-top:30px}
  h2{font-size:1.15rem}
  .eyebrow{font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .sub{color:var(--muted);margin-top:6px}
  .muted{color:var(--muted)}
  .field{display:block;margin-bottom:14px}
  .field span{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:700}
  /* Tickboxes and radios are NOT text boxes: the blanket rule below sizes every
   input to 100% width with 11px of padding, which turned a checkbox into a
   261px block and shoved its label off the row. */
input[type=checkbox],input[type=radio]{
  width:auto;
  flex:none;
  margin:0;
  padding:0;
  border:0;
  border-radius:0;
  background:none;
  accent-color:var(--plum);
}
input,select,textarea{width:100%;font:inherit;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper-2);color:var(--ink)}
  textarea{resize:vertical;min-height:70px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  @media(max-width:620px){.cols{grid-template-columns:1fr}}

  /* Pipeline summary */
  .stats{display:flex;gap:26px;flex-wrap:wrap;margin:6px 0 2px}
  .stat b{display:block;font-size:1.7rem;line-height:1.1}
  .stat span{font-size:.75rem;color:var(--muted)}

  /* Booking rows */
  .bk{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line);flex-wrap:wrap}
  .bk:first-child{border-top:0}
  .bk .when{width:104px;flex:none;font-weight:700;font-size:.86rem}
  .bk .who{flex:1;min-width:180px}
  .bk .who b{display:block;font-size:.98rem}
  .bk .money{text-align:right;font-size:.86rem;flex:none;min-width:130px}
  .pill{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:100px}
  .s-enquiry{background:rgba(126,141,181,.2);color:var(--muted)}
  .s-quoted{background:rgba(91,140,255,.18);color:var(--plum)}
  .s-confirmed{background:rgba(198,242,78,.16);color:var(--neon)}
  .s-completed{background:rgba(233,196,106,.16);color:var(--gold)}
  .s-lost{background:rgba(255,107,94,.15);color:var(--coral)}
  .owed{color:var(--coral);font-weight:700}
  .settled{color:var(--neon);font-weight:700}

  /* Modal */
  .modal{position:fixed;inset:0;z-index:200;background:rgba(4,8,20,.7);display:flex;align-items:center;justify-content:center;padding:22px}
  .modal .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;width:min(620px,100%);max-height:88vh;overflow:auto}
  .tabs{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
  .tab{padding:9px 16px;border-radius:100px;cursor:pointer;font-weight:700;font-size:.88rem;background:transparent;color:var(--muted);border:1.5px solid transparent}
  .tab.on{background:var(--paper-2);color:var(--ink);border-color:var(--line)}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="logo" href="/index.html"><img class="logo-img" src="/img/spinlist-logo-dark.png" alt="Spinlist"></a>
    <div id="spinlist-nav"></div>
  </div>
</header>

<div class="wrap" id="root"><p class="muted" style="margin-top:40px">Loading…</p></div>

<script src="/js/nav.js"></script>
<script>
let ME=null, BOOKINGS=[], CLIENTS=[], TAB='upcoming';

const $=id=>document.getElementById(id);
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* Money is held in PENCE as integers — floats can't represent currency exactly
   (0.1 + 0.2 !== 0.3), which is how invoices end up a penny out. */
function money(pence){
  const n=(pence||0)/100;
  return '£'+n.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function toPence(v){
  const s=String(v==null?'':v).replace(/[£,\s]/g,'').trim();
  if(!s) return 0;
  const f=parseFloat(s);
  if(!Number.isFinite(f)||f<0) return 0;
  return Math.round(f*100);   // round, don't truncate: 19.99 must be 1999
}
function fmtDate(ts){
  if(!ts) return '—';
  return new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}
function dateInput(ts){ return ts? new Date(ts).toISOString().slice(0,10) : ''; }

async function api(url,opts){
  const r=await fetch(url,Object.assign({headers:{'Content-Type':'application/json'}},opts||{}));
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||'Something went wrong');
  return d;
}

async function boot(){
  try{
    const me=await api('/api/me');
    ME=me.user;
  }catch(e){ ME=null; }
  if(!ME){
    $('root').innerHTML='<h1 class="display" style="margin-top:40px">Bookings</h1><p class="sub">Please sign in to manage your bookings.</p><p style="margin-top:18px"><a class="btn btn-neon" href="/index.html">Sign in</a></p>';
    return;
  }
  if(!ME.crm){
    $('root').innerHTML=`<h1 style="margin-top:40px">Bookings</h1>
      <p class="sub">Bookings is an add-on that isn't enabled on your account yet — it tracks enquiries, quotes, payments and your gig calendar in one place.</p>
      <p style="margin-top:18px"><a class="btn btn-ghost" href="/contact.html">Ask about Bookings</a></p>`;
    return;
  }
  await load();
}

async function load(){
  try{
    const d=await api('/api/crm/bookings');
    BOOKINGS=d.bookings||[]; CLIENTS=d.clients||[];
    render();
  }catch(e){
    $('root').innerHTML='<p class="muted" style="margin-top:40px">Could not load your bookings. '+esc(e.message)+'</p>';
  }
}

function render(){
  const now=Date.now();
  const upcoming=BOOKINGS.filter(b=>b.status!=='lost'&&b.status!=='completed'&&(!b.event_date||b.event_date>=now-864e5));
  const past=BOOKINGS.filter(b=>b.status==='completed'||(b.event_date&&b.event_date<now-864e5));
  const lost=BOOKINGS.filter(b=>b.status==='lost');

  // Only count money that's actually committed — an enquiry isn't income.
  const committed=BOOKINGS.filter(b=>b.status==='confirmed'||b.status==='completed');
  const owed=committed.reduce((s,b)=>s+(b.outstanding_pence||0),0);
  const booked=committed.reduce((s,b)=>s+(b.fee_pence||0),0);
  const enquiries=BOOKINGS.filter(b=>b.status==='enquiry').length;

  const list = TAB==='upcoming'?upcoming : TAB==='past'?past : TAB==='lost'?lost : CLIENTS;

  $('root').innerHTML=`
    <p class="eyebrow" style="margin-top:34px">Your business</p>
    <h1>Bookings</h1>
    <p class="sub">Enquiries, confirmed gigs and what you're still owed.</p>

    <div class="panel">
      <div class="stats">
        <div class="stat"><b style="color:var(--neon)">${committed.length}</b><span>confirmed gigs</span></div>
        <div class="stat"><b>${money(booked)}</b><span>booked in</span></div>
        <div class="stat"><b style="color:${owed?'var(--coral)':'var(--neon)'}">${money(owed)}</b><span>outstanding</span></div>
        <div class="stat"><b style="color:var(--plum)">${enquiries}</b><span>open enquiries</span></div>
      </div>
    </div>

    <div style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:22px">
      <div class="tabs" style="margin:0">
        <button class="tab ${TAB==='upcoming'?'on':''}" onclick="setTab('upcoming')">Upcoming (${upcoming.length})</button>
        <button class="tab ${TAB==='past'?'on':''}" onclick="setTab('past')">Past (${past.length})</button>
        <button class="tab ${TAB==='lost'?'on':''}" onclick="setTab('lost')">Lost (${lost.length})</button>
        <button class="tab ${TAB==='clients'?'on':''}" onclick="setTab('clients')">Clients (${CLIENTS.length})</button>
        <button class="tab ${TAB==='settings'?'on':''}" onclick="setTab('settings')">⚙ Setup</button>
      </div>
      <div style="display:flex;gap:8px">
        ${TAB==='settings' ? ''
          : TAB==='clients'
          ? '<button class="btn btn-neon btn-sm" onclick="editClient()">+ New client</button>'
          : '<button class="btn btn-neon btn-sm" onclick="editBooking()">+ New booking</button>'}
      </div>
    </div>

    ${TAB==='settings' ? settingsHtml() : `<div class="panel">${TAB==='clients'?clientsHtml():bookingsHtml(list)}</div>`}
  `;
}

function bookingsHtml(list){
  if(!list.length) return '<p class="muted" style="font-size:.92rem">Nothing here yet.</p>';
  return list.map(b=>{
    const paid=b.paid_pence||0, out=b.outstanding_pence||0;
    const clientName=b.client?b.client.name:'';
    return `<div class="bk">
      <div class="when">${esc(fmtDate(b.event_date))}</div>
      <div class="who">
        <b>${esc(b.title)}</b>
        <span class="muted" style="font-size:.84rem">${esc(b.type||'')}${clientName?' · '+esc(clientName):''}${b.venue?' · '+esc(b.venue):''}</span>
      </div>
      <div><span class="pill s-${esc(b.status)}">${esc(b.status)}</span></div>
      <div class="money">
        ${b.fee_pence?`${money(b.fee_pence)}<br><span class="${out?'owed':'settled'}" style="font-size:.78rem">${out?money(out)+' due':'paid in full'}</span>`:'<span class="muted">—</span>'}
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-ghost btn-sm" onclick="openBooking('${esc(b.id)}')">Open</button>
      </div>
    </div>`;
  }).join('');
}

function clientsHtml(){
  if(!CLIENTS.length) return '<p class="muted" style="font-size:.92rem">No clients yet.</p>';
  return CLIENTS.map(c=>{
    const jobs=BOOKINGS.filter(b=>b.client_id===c.id).length;
    return `<div class="bk">
      <div class="who">
        <b>${esc(c.name)}</b>
        <span class="muted" style="font-size:.84rem">${esc(c.email||'')}${c.phone?' · '+esc(c.phone):''}</span>
      </div>
      <div class="muted" style="font-size:.84rem">${jobs} booking${jobs===1?'':'s'}</div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-ghost btn-sm" onclick="editClient('${esc(c.id)}')">Edit</button>
      </div>
    </div>`;
  }).join('');
}

/* ================= Setup (templates, products, custom fields) =================
   Set these up once, then work in bookings day to day. */
let TEMPLATES=[], PRODUCTS=[], FIELDS=[], FIELD_TYPES=[], ENQUIRY=null, STRIPE=null;
let SETTINGS_ERRORS=[];

async function loadSettings(){
  /* Each call falls back to an empty value so one failure doesn't blank the
     whole tab — but the failure is RECORDED and shown, not swallowed. A
     silent catch here once made a broken endpoint look like an empty list. */
  SETTINGS_ERRORS=[];
  const grab=async(url,fallback)=>{
    try{ return await api(url); }
    catch(err){ SETTINGS_ERRORS.push(url.replace('/api/crm/','')+' \u2014 '+err.message); return fallback; }
  };
  const [t,p,f,e,s]=await Promise.all([
    grab('/api/crm/templates',{templates:[]}),
    grab('/api/crm/products',{products:[]}),
    grab('/api/crm/fields',{fields:[],types:[]}),
    grab('/api/crm/enquiry-link',null),
    grab('/api/crm/stripe/status',null),
  ]);
  TEMPLATES=t.templates||[]; PRODUCTS=p.products||[];
  FIELDS=f.fields||[]; FIELD_TYPES=f.types||[];
  ENQUIRY=e; STRIPE=s;
}

function settingsHtml(){
  /* Records created before the CRM existed have no `kind`. Treat them as
     questionnaires rather than dropping them from both lists. */
  const contracts=TEMPLATES.filter(t=>t.kind==='contract');
  const quests=TEMPLATES.filter(t=>t.kind==='questionnaire'||!t.kind);

  const errBanner=SETTINGS_ERRORS.length?`
    <div class="bk" style="border-left:4px solid #c0392b;background:#fdf3f2">
      <div class="who"><b>Some settings couldn't load</b>
        <div class="sub">${SETTINGS_ERRORS.map(esc).join('<br>')}</div>
      </div>
    </div>`:'';

  const tplRow=t=>`
    <div class="bk">
      <div class="who"><b>${esc(t.name)}</b>
        <span class="muted" style="font-size:.84rem">
          ${t.kind==='questionnaire'
            ? `${(t.form_items&&t.form_items.length?t.form_items:defaultItems(t)).filter(i=>i.kind!=='heading'&&!(i.kind==='core'&&i.show===false)).length} questions · ${t.form_active===false?'not accepting enquiries':'live'}`
            : `${(t.sections||[]).length} section${(t.sections||[]).length===1?'':'s'}`}
          ${t.applies_to&&t.applies_to.length?' · '+esc(t.applies_to.join(', ')):''}
          ${t.is_default?' · default':''}
        </span></div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-ghost btn-sm" onclick="editTemplate('${esc(t.id)}')">Edit</button>
      </div>
    </div>`;

  return `
    ${errBanner}
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <div><h2 style="margin:0">Contracts</h2>
          <p class="muted" style="font-size:.86rem;margin-top:2px">Your terms. Use {{tokens}} to fill in each job's details automatically.</p></div>
        <button class="btn btn-neon btn-sm" onclick="editTemplate(null,'contract')">+ New contract</button>
      </div>
      <div style="margin-top:12px">${contracts.map(tplRow).join('')||'<p class="muted" style="font-size:.9rem">No contracts yet.</p>'}</div>
    </div>

    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <div><h2 style="margin:0">Questionnaires</h2>
          <p class="muted" style="font-size:.86rem;margin-top:2px">What you ask couples and clients.</p></div>
        <button class="btn btn-neon btn-sm" onclick="editTemplate(null,'questionnaire')">+ New questionnaire</button>
      </div>
      <div style="margin-top:12px">${quests.map(tplRow).join('')||'<p class="muted" style="font-size:.9rem">No questionnaires yet.</p>'}</div>
    </div>

    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <div><h2 style="margin:0">Packages</h2>
          <p class="muted" style="font-size:.86rem;margin-top:2px">Presets for quotes. You can still change the price per job.</p></div>
        <button class="btn btn-neon btn-sm" onclick="editProduct()">+ New package</button>
      </div>
      <div style="margin-top:12px">${PRODUCTS.map(p=>`
        <div class="bk">
          ${p.image?`<img src="${esc(p.image)}" alt="" style="width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:none">`:''}
          <div class="who"><b>${esc(p.name)}</b>
            ${p.description?`<span class="muted" style="font-size:.84rem">${esc(p.description)}</span>`:''}</div>
          <div class="money"><b>${money(p.price_pence)}</b></div>
          <div><button class="btn btn-ghost btn-sm" onclick="editProduct('${esc(p.id)}')">Edit</button></div>
        </div>`).join('')||'<p class="muted" style="font-size:.9rem">No packages yet.</p>'}</div>
    </div>

    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <div><h2 style="margin:0">Custom fields</h2>
          <p class="muted" style="font-size:.86rem;margin-top:2px">Anything else you track per job. Each becomes a {{custom.key}} token.</p></div>
        <button class="btn btn-neon btn-sm" onclick="editField()">+ New field</button>
      </div>
      <div style="margin-top:12px">${FIELDS.map(f=>`
        <div class="bk">
          <div class="who"><b>${esc(f.name)}</b>
            <span class="muted" style="font-size:.84rem">{{custom.${esc(f.key)}}} · ${esc(f.type)} · ${f.public?'on the enquiry form':'internal only'}</span></div>
          <div><button class="btn btn-ghost btn-sm" onclick="editField('${esc(f.id)}')">Edit</button></div>
        </div>`).join('')||'<p class="muted" style="font-size:.9rem">No custom fields yet.</p>'}</div>
    </div>

    <div class="panel">
      <h2>Your enquiry form</h2>
      <p class="muted" style="font-size:.86rem;margin-top:2px">Put this on your website — enquiries arrive here as leads.</p>
      ${ENQUIRY?`
        <label class="field" style="margin-top:12px"><span>Link</span>
          <input readonly value="${esc(ENQUIRY.url)}" onclick="this.select()"></label>
        <label class="field"><span>Embed code</span>
          <textarea readonly rows="3" onclick="this.select()">${esc(ENQUIRY.embed)}</textarea></label>`
        :'<p class="muted" style="font-size:.9rem;margin-top:10px">Not available.</p>'}
    </div>

    <div class="panel">
      <h2>Card payments</h2>
      ${!STRIPE||!STRIPE.available
        ? '<p class="muted" style="font-size:.9rem;margin-top:6px">Card payments aren&rsquo;t set up on this system yet.</p>'
        : STRIPE.connected
          ? `<p style="font-size:.9rem;margin-top:6px">✓ Connected — deposits go straight into your own Stripe account.</p>
             <button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="disconnectStripe()">Disconnect</button>`
          : `<p class="muted" style="font-size:.9rem;margin-top:6px">Connect your Stripe account so clients can pay their deposit online. The money goes directly to you.</p>
             <button class="btn btn-neon btn-sm" style="margin-top:10px" onclick="connectStripe()">Connect Stripe</button>`}
    </div>
  `;
}

/* ---------- Template editor ---------- */
function editTemplate(id,kind){
  const t=id?TEMPLATES.find(x=>x.id===id):null;
  const k=t?t.kind:(kind||'contract');
  const sections=(t&&t.sections||[]);

  const box=document.createElement('div');
  box.className='modal'; box.id='bk-modal';
  box.innerHTML=`<div class="card" style="width:min(820px,100%)">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
      <h2>${t?'Edit':'New'} ${k==='contract'?'contract':'questionnaire'}</h2>
      <button onclick="closeModal()" style="background:none;border:0;color:var(--muted);font-size:1.4rem;cursor:pointer;line-height:1">×</button>
    </div>

    <label class="field" style="margin-top:16px"><span>Name</span>
      <input id="t-name" value="${esc(t?t.name:'')}" placeholder="${k==='contract'?'e.g. Wedding DJ Agreement':'e.g. Wedding questionnaire'}"></label>

    <label class="field"><span>Use for (leave blank for all job types)</span>
      <input id="t-applies" value="${esc(t&&t.applies_to?t.applies_to.join(', '):'')}" placeholder="Wedding, Corporate"></label>

    <label class="check-row" style="display:flex;gap:9px;align-items:center;cursor:pointer;margin-bottom:14px">
      <input type="checkbox" id="t-default" ${t&&t.is_default?'checked':''}>
      <span style="font-size:.9rem">Use this one by default</span></label>

    ${k==='questionnaire'?questionnaireFormHtml(t):`
    <div style="display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px">
      <h2 style="font-size:1rem;margin:0">Sections</h2>
      <button class="btn btn-ghost btn-sm" onclick="addSection()">+ Add section</button>
    </div>
    <div id="t-sections">${sections.map((s,i)=>sectionRow(s,i)).join('')||sectionRow({heading:'',body:''},0)}</div>`}

    <details style="margin-top:16px" ${k==='questionnaire'?'hidden':''}>
      <summary style="cursor:pointer;color:var(--plum);font-size:.88rem;font-weight:700">Which {{tokens}} can I use?</summary>
      <div class="muted" style="font-size:.82rem;margin-top:8px;line-height:1.7">
        <b style="color:var(--ink-2)">People:</b> {{clients.first_names}} · {{clients.names}} · {{primary_contact.name}} · {{partner_a.first_name}} · {{venue.name}} · {{venue.address}}<br>
        <b style="color:var(--ink-2)">Job:</b> {{booking.title}} · {{booking.date}} · {{booking.venue}} · {{booking.fee}} · {{booking.deposit}}<br>
        <b style="color:var(--ink-2)">Times:</b> {{setup.start_time}} · {{main_event.start_time}} · {{main_event.end_time}} · {{primary_session.location.address}}<br>
        <b style="color:var(--ink-2)">Money:</b> {{booked_order.summary}} · {{payment_schedule.summary_text}}<br>
        <b style="color:var(--ink-2)">You:</b> {{dj.name}} · {{dj.company}} · {{brand.name}}<br>
        ${FIELDS.length?'<b style="color:var(--ink-2)">Yours:</b> '+FIELDS.map(f=>'{{custom.'+esc(f.key)+'}}').join(' · '):''}
        <br><br>Formatting: <b>**bold**</b>, lines starting "- " become bullets, "---" draws a line.
      </div>
    </details>

    <div style="display:flex;gap:8px;margin-top:20px;flex-wrap:wrap">
      <button class="btn btn-neon" onclick="saveTemplate('${esc(t?t.id:'')}','${esc(k)}')">${t?'Save changes':'Create'}</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      ${t?`<button class="btn btn-danger btn-sm" style="margin-left:auto" onclick="delTemplate('${esc(t.id)}')">Delete</button>`:''}
    </div>
  </div>`;
  document.body.appendChild(box);
  if(k==='questionnaire') renderItems();
}

/* ---------- Quotes ----------
   A quote belongs to a booking: the balance due date is worked out from the
   event date, so quoting is always done from inside a booking rather than in
   the abstract. Drafts are editable; once sent the figures are frozen server
   side, because the client may already be reading them. */
let QUOTES=[], QUOTE_ITEMS=[], QUOTE_BOOKING=null;

const QUOTE_STATUS={
  draft:    ['Draft','#6b7280'],
  sent:     ['Sent','#5B8CFF'],
  accepted: ['Accepted','#1a8a4a'],
  declined: ['Declined','#c0392b'],
  expired:  ['Expired','#a06000'],
};

function quoteTotals(){
  const subtotal=QUOTE_ITEMS.reduce((s,it)=>s+(it.qty||1)*(it.unit_pence||0),0);
  const type=$('q-dep-type')?$('q-dep-type').value:'percent';
  const raw=$('q-dep-value')?$('q-dep-value').value:'0';
  let deposit=type==='fixed'?toPence(raw):Math.round(subtotal*((parseFloat(raw)||0)/100));
  deposit=Math.max(0,Math.min(deposit,subtotal));
  return {subtotal,deposit,balance:Math.max(0,subtotal-deposit)};
}

/* The date the client will actually see, worked out the same way the server
   does it — so the builder can't promise a date the quote won't show. */
function balanceDueLabel(){
  const days=parseInt($('q-days')?$('q-days').value:'',10);
  if(!QUOTE_BOOKING||!QUOTE_BOOKING.event_date||!days&&days!==0) return '';
  return 'Balance due '+fmtDate(QUOTE_BOOKING.event_date-days*864e5);
}

async function openQuotes(bookingId){
  QUOTE_BOOKING=BOOKINGS.find(b=>b.id===bookingId)||null;
  try{
    const d=await api('/api/crm/quotes?booking_id='+encodeURIComponent(bookingId));
    QUOTES=d.quotes||[];
  }catch(e){ alert(e.message); return; }
  renderQuotesModal(bookingId);
}

function renderQuotesModal(bookingId){
  closeModal();
  const rows=QUOTES.map(q=>{
    const [label,colour]=QUOTE_STATUS[q.status]||['?','#666'];
    const editable=q.status==='draft';
    return `
      <div class="bk">
        <div class="who">
          <b>${money(q.total)}</b>
          <span style="color:${colour};font-size:.8rem;font-weight:700;margin-left:8px">${label}</span>
          <span class="muted" style="display:block;font-size:.84rem">
            ${q.items.length} item${q.items.length===1?'':'s'} ·
            ${q.deposit?money(q.deposit)+' deposit':'no deposit'}${q.sent_at?' · sent '+esc(fmtDate(q.sent_at)):''}
          </span>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${editable
            ? `<button class="btn btn-ghost btn-sm" onclick="editQuote('${esc(bookingId)}','${esc(q.id)}')">Edit</button>
               <button class="btn btn-neon btn-sm" onclick="sendQuote('${esc(q.id)}')">Send</button>`
            : `<button class="btn btn-ghost btn-sm" onclick="copyQuoteLink('${esc(q.token)}')">Copy link</button>`}
          ${editable?`<button class="btn btn-ghost btn-sm" onclick="removeQuote('${esc(q.id)}')">Delete</button>`:''}
        </div>
      </div>`;
  }).join('');

  const box=document.createElement('div');
  box.className='modal';
  box.innerHTML=`
    <div class="card" style="width:min(720px,100%)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
        <h2>Quotes</h2>
        <button onclick="closeModal()" style="background:none;border:0;color:var(--muted);font-size:1.4rem;cursor:pointer;line-height:1">&times;</button>
      </div>
      <p class="muted" style="font-size:.86rem;margin:0 0 14px">
        ${esc(QUOTE_BOOKING?QUOTE_BOOKING.title||'This booking':'This booking')}
      </p>
      ${rows||'<p class="muted" style="font-size:.9rem">No quotes yet.</p>'}
      <div style="margin-top:16px">
        <button class="btn btn-neon" onclick="editQuote('${esc(bookingId)}','')">+ New quote</button>
      </div>
    </div>`;
  document.body.appendChild(box);
  box.addEventListener('click',e=>{ if(e.target===box) closeModal(); });
}

function editQuote(bookingId,quoteId){
  const q=quoteId?QUOTES.find(x=>x.id===quoteId):null;
  QUOTE_BOOKING=BOOKINGS.find(b=>b.id===bookingId)||QUOTE_BOOKING;
  QUOTE_ITEMS=q?JSON.parse(JSON.stringify(q.items||[])):[];

  closeModal();
  const box=document.createElement('div');
  box.className='modal';
  box.innerHTML=`
    <div class="card" style="width:min(720px,100%)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
        <h2>${q?'Edit quote':'New quote'}</h2>
        <button onclick="closeModal()" style="background:none;border:0;color:var(--muted);font-size:1.4rem;cursor:pointer;line-height:1">&times;</button>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin:4px 0 8px">
        <h3 style="font-size:1rem;margin:0">What they're getting</h3>
        <div style="display:flex;gap:6px">
          <select id="q-preset" onchange="addQuoteItem(this.value);this.value=''" style="width:auto">
            <option value="">Add a package…</option>
            ${PRODUCTS.filter(p=>p.active!==false).map(p=>
              `<option value="${esc(p.id)}">${esc(p.name)} — ${money(p.price_pence)}</option>`).join('')}
          </select>
          <button class="btn btn-ghost btn-sm" onclick="addQuoteItem('')">+ Blank line</button>
        </div>
      </div>
      <div id="q-items"></div>
      <div id="q-totals" style="margin-top:12px"></div>

      <h3 style="font-size:1rem;margin:22px 0 4px">Payment terms</h3>
      <div class="two" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <label class="field"><span>Deposit</span>
          <select id="q-dep-type" onchange="renderQuoteTotals()">
            <option value="percent" ${!q||q.deposit_type!=='fixed'?'selected':''}>Percentage</option>
            <option value="fixed" ${q&&q.deposit_type==='fixed'?'selected':''}>Fixed amount</option>
          </select></label>
        <label class="field"><span id="q-dep-label">Amount</span>
          <input id="q-dep-value" oninput="renderQuoteTotals()"
            value="${q?(q.deposit_type==='fixed'?(q.deposit_value/100).toFixed(2):q.deposit_value):'25'}"></label>
      </div>
      <label class="field"><span>Balance due this many days before the event</span>
        <input id="q-days" type="number" min="0" value="${q?q.balance_days_before:28}" oninput="renderQuoteTotals()">
        <span class="muted" id="q-due" style="font-size:.82rem"></span></label>

      <label class="field"><span>Message to the client</span>
        <textarea id="q-message" rows="4" placeholder="Anything you'd like to say alongside the numbers.">${esc(q?q.message||'':'')}</textarea></label>

      <label class="field"><span>Quote valid until</span>
        <input id="q-expires" type="date" value="${q&&q.expires_at?new Date(q.expires_at).toISOString().slice(0,10):new Date(Date.now()+30*864e5).toISOString().slice(0,10)}"></label>

      <div style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap">
        <button class="btn btn-neon" onclick="saveQuote('${esc(bookingId)}','${esc(quoteId||'')}',false)">Save draft</button>
        <button class="btn btn-ghost" onclick="saveQuote('${esc(bookingId)}','${esc(quoteId||'')}',true)">Save &amp; send</button>
        <button class="btn btn-ghost" onclick="openQuotes('${esc(bookingId)}')">Back</button>
      </div>
    </div>`;
  document.body.appendChild(box);
  box.addEventListener('click',e=>{ if(e.target===box) closeModal(); });
  renderQuoteItems();
}

function renderQuoteItems(){
  const box=$('q-items');
  if(!box) return;
  box.innerHTML=QUOTE_ITEMS.map((it,i)=>`
    <div class="bk" style="display:block">
      <div style="display:flex;gap:8px;align-items:center">
        ${it.image
          ? `<img src="${esc(it.image)}" alt="" style="width:38px;height:38px;object-fit:cover;border-radius:7px;border:1px solid var(--line);flex:none">`
          : `<span style="width:38px;height:38px;border-radius:7px;border:1px dashed var(--line);flex:none" aria-hidden="true"></span>`}
        <input value="${esc(it.name||'')}" placeholder="What it is"
          oninput="setQuoteItem(${i},'name',this.value)" style="flex:1">
        <input type="number" min="1" value="${it.qty||1}" title="Quantity"
          oninput="setQuoteItem(${i},'qty',parseInt(this.value,10)||1)" style="width:70px;flex:none">
        <input value="${((it.unit_pence||0)/100).toFixed(2)}" title="Price each"
          oninput="setQuoteItemPrice(${i},this.value)" style="width:100px;flex:none">
        <button onclick="removeQuoteItem(${i})" title="Remove"
          style="background:none;border:0;color:var(--muted);font-size:1.2rem;cursor:pointer;line-height:1;flex:none">&times;</button>
      </div>
      <textarea rows="2" placeholder="Description (optional — the client sees this)"
        oninput="setQuoteItem(${i},'description',this.value)" style="margin-top:8px">${esc(it.description||'')}</textarea>
      <div class="muted" style="font-size:.82rem;margin-top:6px">Line total ${money((it.qty||1)*(it.unit_pence||0))}</div>
    </div>`).join('')||'<p class="muted" style="font-size:.9rem">Nothing on the quote yet.</p>';
  renderQuoteTotals();
}

function renderQuoteTotals(){
  const el=$('q-totals');
  if(!el) return;
  const t=quoteTotals();
  const type=$('q-dep-type')?$('q-dep-type').value:'percent';
  if($('q-dep-label')) $('q-dep-label').textContent=type==='fixed'?'Amount (£)':'Percentage (%)';
  if($('q-due')) $('q-due').textContent=balanceDueLabel();
  el.innerHTML=`
    <div style="border-top:1px solid var(--line);padding-top:10px;font-size:.92rem">
      <div style="display:flex;justify-content:space-between"><span>Total</span><b>${money(t.subtotal)}</b></div>
      <div style="display:flex;justify-content:space-between;color:var(--muted)"><span>Deposit</span><span>${money(t.deposit)}</span></div>
      <div style="display:flex;justify-content:space-between;color:var(--muted)"><span>Balance</span><span>${money(t.balance)}</span></div>
    </div>`;
}

function setQuoteItem(i,k,v){ if(QUOTE_ITEMS[i]){ QUOTE_ITEMS[i][k]=v; if(k==='qty') renderQuoteItems(); else renderQuoteTotals(); } }
function setQuoteItemPrice(i,v){ if(QUOTE_ITEMS[i]){ QUOTE_ITEMS[i].unit_pence=toPence(v); renderQuoteTotals(); } }
function removeQuoteItem(i){ QUOTE_ITEMS.splice(i,1); renderQuoteItems(); }

function addQuoteItem(productId){
  const p=productId?PRODUCTS.find(x=>x.id===productId):null;
  // The picture is snapshotted onto the line, like the price: changing a
  // package later must not alter a quote already sent.
  QUOTE_ITEMS.push(p
    ? {name:p.name,description:p.description||'',qty:1,unit_pence:p.price_pence||0,image:p.image||''}
    : {name:'',description:'',qty:1,unit_pence:0,image:''});
  renderQuoteItems();
}

function quoteBody(){
  const t=$('q-dep-type').value;
  return {
    items:QUOTE_ITEMS.filter(it=>(it.name||'').trim()),
    deposit_type:t,
    deposit_value:t==='fixed'?toPence($('q-dep-value').value):(parseInt($('q-dep-value').value,10)||0),
    balance_days_before:parseInt($('q-days').value,10)||0,
    message:$('q-message').value,
    expires_at:$('q-expires').value?new Date($('q-expires').value+'T23:59:59').getTime():null,
  };
}

async function saveQuote(bookingId,quoteId,thenSend){
  const body=quoteBody();
  if(!body.items.length){ alert('Add at least one item first — a quote with nothing on it isn\'t much use.'); return; }
  try{
    let id=quoteId;
    if(id) await api('/api/crm/quotes/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(body)});
    else {
      const r=await api('/api/crm/quotes',{method:'POST',body:JSON.stringify(Object.assign({booking_id:bookingId},body))});
      id=r.quote&&r.quote.id;
    }
    if(thenSend&&id) return sendQuote(id,bookingId);
    await openQuotes(bookingId);
  }catch(e){ alert(e.message); }
}

async function sendQuote(id,bookingId){
  const q=QUOTES.find(x=>x.id===id);
  const to=(QUOTE_BOOKING&&QUOTE_BOOKING.contacts&&QUOTE_BOOKING.contacts.primary_contact&&QUOTE_BOOKING.contacts.primary_contact.email)||'';
  const addr=prompt('Send this quote to:',to);
  if(addr===null) return;
  if(!addr.trim()){ alert('Please give an email address.'); return; }
  try{
    await api('/api/crm/quotes/'+encodeURIComponent(id)+'/send',{method:'POST',body:JSON.stringify({to:addr.trim()})});
    await openQuotes(bookingId||(q&&q.booking_id)||(QUOTE_BOOKING&&QUOTE_BOOKING.id));
    alert('Sent. The figures are locked now — make a new quote if anything changes.');
  }catch(e){ alert(e.message); }
}

async function removeQuote(id){
  if(!confirm('Delete this draft quote?')) return;
  try{
    await api('/api/crm/quotes/'+encodeURIComponent(id),{method:'DELETE'});
    await openQuotes(QUOTE_BOOKING&&QUOTE_BOOKING.id);
  }catch(e){ alert(e.message); }
}

function copyQuoteLink(token){
  const url=location.origin+'/quote.html?q='+token;
  if(navigator.clipboard) navigator.clipboard.writeText(url).then(()=>alert('Link copied:\n'+url),()=>prompt('Copy this link:',url));
  else prompt('Copy this link:',url);
}

/* ---------- Enquiry form builder ----------
   A form is one ordered list. Core items map onto real booking columns so they
   can be relabelled, reordered and hidden but not invented; name and email are
   locked, because an enquiry nobody can reply to isn't a lead. */
const CORE=[
  ['name','Your name','text',true],
  ['email','Email','email',true],
  ['phone','Phone','tel',false],
  ['event_type','What kind of event?','select',false],
  ['event_date','Date','date',false],
  ['venue','Venue','venue',false],
  ['partners','Names of the couple','partners',false],
  ['message','Tell us about your event','textarea',false],
];
const DEFAULT_EVENT_TYPES=['Wedding','Corporate event','Birthday party','Anniversary',
                           'Christmas party','School prom','Other'];
const Q_TYPES=[['text','Short answer'],['textarea','Long answer'],['dropdown','Choose one'],
               ['checkbox','Yes / no tickbox'],['date','Date'],['time','Time'],
               ['address','Address (map lookup)'],['number','Number']];

let EDIT_ITEMS=[];

function coreMeta(key){ return CORE.find(c=>c[0]===key); }

/* Forms built before the ordered list get one derived from what they had, so
   nothing has to be rebuilt by hand. */
function defaultItems(t){
  const items=CORE.map(([key,label,,locked])=>({
    kind:'core',key,label,show:true,required:!!locked,
    options:key==='event_type'?DEFAULT_EVENT_TYPES.slice():undefined,
  }));
  ((t&&t.form_fields)||[]).forEach(key=>items.push({kind:'field',key,label:'',required:false}));
  ((t&&t.questions)||[]).forEach(q=>items.push({kind:'question',key:q.key,label:q.label,
    type:q.type,options:q.options||[],required:!!q.required}));
  return items;
}

function questionnaireFormHtml(t){
  EDIT_ITEMS=(t&&Array.isArray(t.form_items)&&t.form_items.length)
    ? JSON.parse(JSON.stringify(t.form_items)) : defaultItems(t);

  return `
    <label class="check-row" style="display:flex;gap:9px;align-items:center;cursor:pointer;margin:6px 0 18px">
      <input type="checkbox" id="t-active" ${!t||t.form_active!==false?'checked':''}>
      <span style="font-size:.9rem">Accepting enquiries
        <span class="muted" style="display:block;font-size:.82rem">Turn off and the embedded form stops taking submissions.</span>
      </span></label>

    <label class="field"><span>Intro shown above the form</span>
      <textarea id="t-intro" rows="3" placeholder="A line or two about what happens after they get in touch.">${esc(t?t.intro||'':'')}</textarea></label>

    <label class="field"><span>Message shown after they send it</span>
      <textarea id="t-thanks" rows="2" placeholder="Thanks — I'll come back to you within 24 hours.">${esc(t?t.thanks||'':'')}</textarea></label>

    <div style="margin:22px 0 8px">
      <h2 style="font-size:1rem;margin:0">The form</h2>
      <p class="muted" style="font-size:.82rem;margin:4px 0 0">Everything it asks, in the order it's asked. Rename anything, turn off what you don't want, reorder with the arrows.</p>
    </div>
    <div id="t-items"></div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm" onclick="addItem('question')">+ Question</button>
      <button class="btn btn-ghost btn-sm" onclick="addItem('field')">+ One of your fields</button>
      <button class="btn btn-ghost btn-sm" onclick="addItem('heading')">+ Section heading</button>
    </div>

    ${t?`<div style="margin-top:20px">
      <button class="btn btn-ghost btn-sm" onclick="showFormLink('${esc(t.id)}')">Get the embed code</button>
      <div id="t-link" style="margin-top:10px"></div>
    </div>`:'<p class="muted" style="font-size:.82rem;margin-top:16px">Create it, then come back for the embed code.</p>'}
  `;
}

function renderItems(){
  const box=$('t-items');
  if(!box) return;
  box.innerHTML=EDIT_ITEMS.map((it,i)=>itemRow(it,i)).join('')
    ||'<p class="muted" style="font-size:.9rem">Nothing on the form yet.</p>';
}

function itemRow(it,i){
  const last=i===EDIT_ITEMS.length-1;
  const locked=it.kind==='core'&&(coreMeta(it.key)||[])[3];
  const move=`
    <div style="display:flex;flex-direction:column;gap:2px;flex:none">
      <button onclick="moveItem(${i},-1)" ${i===0?'disabled':''} title="Move up"
        style="background:none;border:0;cursor:pointer;color:var(--muted);line-height:1;padding:0 4px">&#9650;</button>
      <button onclick="moveItem(${i},1)" ${last?'disabled':''} title="Move down"
        style="background:none;border:0;cursor:pointer;color:var(--muted);line-height:1;padding:0 4px">&#9660;</button>
    </div>`;

  if(it.kind==='heading') return `
    <div class="bk" style="display:flex;gap:8px;align-items:center">
      ${move}
      <input value="${esc(it.label||'')}" oninput="setItem(${i},'label',this.value)"
        placeholder="Section heading" style="flex:1;font-weight:700">
      <span class="muted" style="font-size:.78rem;flex:none">heading</span>
      <button onclick="removeItem(${i})" title="Remove"
        style="background:none;border:0;color:var(--muted);font-size:1.2rem;cursor:pointer;line-height:1;flex:none">&times;</button>
    </div>`;

  const kindLabel=it.kind==='core'?'standard'
    :it.kind==='field'?'your field'
    :(Q_TYPES.find(q=>q[0]===it.type)||['','question'])[1].toLowerCase();

  const fieldDef=it.kind==='field'?FIELDS.find(f=>f.key===it.key):null;
  const placeholder=it.kind==='core'?(coreMeta(it.key)||[])[1]:(fieldDef?fieldDef.name:'Question');
  const showOpts=(it.kind==='question'&&it.type==='dropdown')||(it.kind==='core'&&it.key==='event_type');

  return `
    <div class="bk" style="display:block">
      <div style="display:flex;gap:8px;align-items:center">
        ${move}
        <input value="${esc(it.label||'')}" oninput="setItem(${i},'label',this.value)"
          placeholder="${esc(placeholder||'')}" style="flex:1">
        ${it.kind==='question'?`
          <select onchange="setItem(${i},'type',this.value)" style="flex:none;width:150px">
            ${Q_TYPES.map(([v,l])=>`<option value="${v}" ${it.type===v?'selected':''}>${l}</option>`).join('')}
          </select>`
          :`<span class="muted" style="font-size:.78rem;flex:none;width:80px;text-align:right">${esc(kindLabel)}</span>`}
        ${locked?'<span style="width:22px;flex:none"></span>'
          :`<button onclick="removeItem(${i})" title="Remove"
             style="background:none;border:0;color:var(--muted);font-size:1.2rem;cursor:pointer;line-height:1;flex:none">&times;</button>`}
      </div>

      ${showOpts?`<textarea rows="3" placeholder="One choice per line"
          oninput="setItemOptions(${i},this.value)" style="margin-top:8px">${esc((it.options||[]).join('\n'))}</textarea>`:''}

      <div style="display:flex;gap:16px;margin-top:8px;font-size:.84rem;flex-wrap:wrap">
        ${it.kind==='core'&&!locked?`
          <label style="display:flex;gap:7px;align-items:center;cursor:pointer">
            <input type="checkbox" ${it.show!==false?'checked':''} onchange="setItem(${i},'show',this.checked)"> Ask this
          </label>`:''}
        ${locked?'<span class="muted">Always asked &mdash; you need a name and an email to reply.</span>':`
          <label style="display:flex;gap:7px;align-items:center;cursor:pointer">
            <input type="checkbox" ${it.required?'checked':''} onchange="setItem(${i},'required',this.checked)"> Must answer
          </label>`}
      </div>
    </div>`;
}

function setItem(i,k,v){ if(EDIT_ITEMS[i]){ EDIT_ITEMS[i][k]=v; if(k==='type')renderItems(); } }
function setItemOptions(i,v){
  if(EDIT_ITEMS[i]) EDIT_ITEMS[i].options=v.split('\n').map(x=>x.trim()).filter(Boolean);
}
function moveItem(i,d){
  const j=i+d;
  if(j<0||j>=EDIT_ITEMS.length) return;
  const tmp=EDIT_ITEMS[i]; EDIT_ITEMS[i]=EDIT_ITEMS[j]; EDIT_ITEMS[j]=tmp;
  renderItems();
}
function removeItem(i){
  const it=EDIT_ITEMS[i];
  if(it&&it.kind==='core'&&(coreMeta(it.key)||[])[3]) return;   // name and email stay
  EDIT_ITEMS.splice(i,1);
  renderItems();
}
function addItem(kind){
  if(kind==='heading'){ EDIT_ITEMS.push({kind:'heading',label:''}); }
  else if(kind==='question'){ EDIT_ITEMS.push({kind:'question',key:'',label:'',type:'text',options:[],required:false}); }
  else {
    const used=EDIT_ITEMS.filter(i=>i.kind==='field').map(i=>i.key);
    const spare=FIELDS.filter(f=>f.public&&!used.includes(f.key));
    if(!spare.length){
      alert(FIELDS.some(f=>f.public)
        ? 'All your askable fields are already on this form.'
        : 'No fields are marked askable yet. Edit a custom field and tick "Ask this on the public enquiry form".');
      return;
    }
    EDIT_ITEMS.push({kind:'field',key:spare[0].key,label:spare[0].name,required:false});
  }
  renderItems();
}

/* Keys are derived from the wording, which is how an answer is matched back on
   submission. Items with no label are dropped rather than saved half-made. */
function readItems(){
  return EDIT_ITEMS.map(it=>{
    if(it.kind==='heading') return (it.label||'').trim()?{kind:'heading',label:it.label.trim()}:null;
    if(it.kind==='core'){
      const o={kind:'core',key:it.key,label:(it.label||'').trim(),
               show:it.show!==false,required:!!it.required};
      if(it.key==='event_type') o.options=it.options||[];
      return o;
    }
    if(it.kind==='field') return {kind:'field',key:it.key,label:(it.label||'').trim(),required:!!it.required};
    const label=(it.label||'').trim();
    const key=label.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40);
    return (label&&key)?{kind:'question',key,label,type:it.type||'text',
      options:it.type==='dropdown'?(it.options||[]):[],required:!!it.required}:null;
  }).filter(Boolean);
}

  try{

// Warn if the date is already taken — the double-booking question.
async function checkClash(date,selfId){
  const el=$('clash'); if(!el) return;
  el.textContent='';
  if(!date) return;
  try{
    const d=await api('/api/crm/availability?date='+encodeURIComponent(date));
    const others=(d.bookings||[]).filter(b=>b.id!==selfId);
    if(others.length){
      el.innerHTML='⚠ <span style="color:var(--coral)">Already booked that day: '+esc(others.map(b=>b.title).join(', '))+'</span>';
    }
  }catch(e){ /* availability is advisory — never block saving */ }
}

/* Custom field answers on a booking. These were being written by the enquiry
   form and by templates but never displayed anywhere, so an answer a client
   gave was invisible the moment it arrived. */
function bookingFieldRow(f,b){
  const v=(b&&b.custom&&b.custom[f.key]!==undefined)?b.custom[f.key]:'';
  const id='cf-'+f.key;
  if(f.type==='checkbox') return `
    <label style="display:flex;gap:9px;align-items:center;margin:0 0 10px;font-size:.9rem;cursor:pointer">
      <input type="checkbox" id="${esc(id)}" data-key="${esc(f.key)}" class="cf" ${v===true||v==='true'?'checked':''}>
      ${esc(f.name)}</label>`;
  if(f.type==='textarea') return `
    <label class="field"><span>${esc(f.name)}</span>
      <textarea id="${esc(id)}" data-key="${esc(f.key)}" class="cf" rows="2">${esc(String(v))}</textarea></label>`;
  if(f.type==='dropdown') return `
    <label class="field"><span>${esc(f.name)}</span>
      <select id="${esc(id)}" data-key="${esc(f.key)}" class="cf">
        <option value="">—</option>
        ${(f.options||[]).map(o=>`<option ${String(v)===o?'selected':''}>${esc(o)}</option>`).join('')}
      </select></label>`;
  const t=f.type==='date'?'date':f.type==='time'?'time'
         :f.type==='number'||f.type==='money'?'number':'text';
  return `
    <label class="field"><span>${esc(f.name)}${f.type==='money'?' (£)':''}</span>
      <input id="${esc(id)}" data-key="${esc(f.key)}" class="cf" type="${t}"
        ${f.type==='money'?'step="0.01"':''} value="${esc(String(v))}"></label>`;
}

/* Saved one at a time because that's the route the server exposes. Only changed
   values are sent, so opening and closing a booking costs nothing. */
async function saveBookingFields(id){
  const rows=[...document.querySelectorAll('.cf')];
  const b=BOOKINGS.find(x=>x.id===id);
  const before=(b&&b.custom)||{};
  for(const el of rows){
    const key=el.dataset.key;
    const val=el.type==='checkbox'?el.checked:el.value.trim();
    const was=before[key]===undefined?(el.type==='checkbox'?false:''):before[key];
    if(String(val)===String(was)) continue;
    await api('/api/crm/bookings/'+encodeURIComponent(id)+'/custom/'+encodeURIComponent(key),
      {method:'PUT',body:JSON.stringify({value:val===''?null:val})});
  }
}

/* Taking a booking over the phone shouldn't mean leaving the booking to go and
   create a client first — that's the step everyone skips, which is why bookings
   ended up with no client attached. */
async function newClientInline(){
  const name=prompt('Client name');
  if(name===null) return;
  if(!name.trim()){ alert('A name is needed.'); return; }
  const email=prompt('Email (optional — but it\'s how repeat clients get matched up)','')||'';
  const phone=prompt('Phone (optional)','')||'';
  try{
    const r=await api('/api/crm/clients',{method:'POST',
      body:JSON.stringify({name:name.trim(),email:email.trim(),phone:phone.trim()})});
    const c=r.client;
    CLIENTS.push(c);
    CLIENTS.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    const sel=$('f-client');
    const opt=document.createElement('option');
    opt.value=c.id; opt.textContent=c.name;
    sel.appendChild(opt);
    sel.value=c.id;
  }catch(e){ alert(e.message); }
}

async function saveBooking(id){
  const body={
    title:$('f-title').value.trim(),
    type:$('f-type').value,
    status:$('f-status').value,
    venue:$('f-venue').value.trim(),
    notes:$('f-notes').value,
    client_id:$('f-client').value||null,
    event_date:$('f-date').value? new Date($('f-date').value+'T12:00:00').getTime() : null,
    fee_pence:toPence($('f-fee').value),
    deposit_pence:toPence($('f-dep').value),
  };
  if(!body.title){ alert('Give the booking a title.'); return; }
  if(!body.client_id && !confirm('No client is attached to this booking. Save it anyway?')) return;
  try{
    if(id){
      await api('/api/crm/bookings/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(body)});
      await saveBookingFields(id);
    } else {
      const r=await api('/api/crm/bookings',{method:'POST',body:JSON.stringify(body)});
      if(r&&r.booking&&r.booking.id) await saveBookingFields(r.booking.id);
    }
    closeModal(); await load();
  }catch(e){ alert(e.message); }
}

async function delBooking(id){
  if(!confirm('Delete this booking? This cannot be undone.'))return;
  try{ await api('/api/crm/bookings/'+encodeURIComponent(id),{method:'DELETE'}); closeModal(); await load(); }
  catch(e){ alert(e.message); }
}

async function addPayment(id){
  const amt=toPence($('p-amt').value);
  if(!amt){ alert('Enter an amount.'); return; }
  try{
    await api('/api/crm/bookings/'+encodeURIComponent(id)+'/payments',
      {method:'POST',body:JSON.stringify({amount_pence:amt,method:$('p-method').value.trim()||'manual'})});
    closeModal(); await load();
    const fresh=BOOKINGS.find(b=>b.id===id); if(fresh) editBooking(id);
  }catch(e){ alert(e.message); }
}

async function delPayment(id,pid){
  try{
    await api('/api/crm/bookings/'+encodeURIComponent(id)+'/payments/'+encodeURIComponent(pid),{method:'DELETE'});
    closeModal(); await load();
    editBooking(id);
  }catch(e){ alert(e.message); }
}

/* ---------- Client editor ---------- */
function editClient(id){
  const c=id?CLIENTS.find(x=>x.id===id):null;
  const box=document.createElement('div');
  box.className='modal'; box.id='cl-modal';
  box.innerHTML=`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
      <h2>${c?'Edit client':'New client'}</h2>
      <button onclick="closeModal()" style="background:none;border:0;color:var(--muted);font-size:1.4rem;cursor:pointer;line-height:1">×</button>
    </div>
    <label class="field" style="margin-top:16px"><span>Name</span>
      <input id="c-name" value="${esc(c?c.name:'')}" placeholder="Sarah &amp; Tom / Acme Ltd"></label>
    <div class="cols">
      <label class="field"><span>Email</span><input id="c-email" value="${esc(c?c.email:'')}"></label>
      <label class="field"><span>Phone</span><input id="c-phone" value="${esc(c?c.phone:'')}"></label>
    </div>
    <label class="field"><span>Notes</span>
      <textarea id="c-notes" placeholder="How they found you, preferences, anything useful…">${esc(c?c.notes:'')}</textarea></label>
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
      <button class="btn btn-neon" onclick="saveClient('${esc(c?c.id:'')}')">${c?'Save':'Add client'}</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      ${c?`<button class="btn btn-danger btn-sm" style="margin-left:auto" onclick="delClient('${esc(c.id)}')">Delete</button>`:''}
    </div>
  </div>`;
  document.body.appendChild(box);
  box.addEventListener('click',e=>{ if(e.target===box) closeModal(); });
}

async function saveClient(id){
  const body={name:$('c-name').value.trim(),email:$('c-email').value.trim(),
              phone:$('c-phone').value.trim(),notes:$('c-notes').value};
  if(!body.name){ alert('Give the client a name.'); return; }
  try{
    if(id) await api('/api/crm/clients/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(body)});
    else await api('/api/crm/clients',{method:'POST',body:JSON.stringify(body)});
    closeModal(); await load();
  }catch(e){ alert(e.message); }
}

async function delClient(id){
  if(!confirm('Delete this client? Their bookings are kept, but unlinked.'))return;
  try{ await api('/api/crm/clients/'+encodeURIComponent(id),{method:'DELETE'}); closeModal(); await load(); }
  catch(e){ alert(e.message); }
}

document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
boot();
</script>
